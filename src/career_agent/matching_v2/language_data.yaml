# Linguistic relations between words of different languages (ADR-0037).
#
# DATA, NOT CODE. Nothing here is a person's preference, and no entry names a
# profession, a product or an employer: these are ordinary words of working
# life, the same in any field. A word belongs here only when its translation
# is the SAME concept; a related, broader or narrower concept is recorded
# under `non_automatic` so the reason it does not match is written down.
#
# Matching compares ROOTS (`match.phrase_forms.root`). An entry maps every
# form's root to the root of its first English form.
#
#   EXACT_EQUIVALENT  one word, one word, the same meaning in both languages
#   FIXED_EXPRESSION  a term translated as a unit; matched as a sequence
#   MORPHOLOGICAL_VARIANT  a rule on roots, proven by its own examples
#
# A same-language synonym (client / customer, vendor / supplier) is NOT a
# translation: it widens the concept, so it is never listed here.
#
# Spanish forms are a demonstration that the design is not bilingual by
# construction. Spanish is NOT supported: the table holds a handful of words.
version: 1

exact_equivalent:
  - {en: [system, systems], pt: [sistema, sistemas], es: [sistema, sistemas]}
  - {en: [data], pt: [dados, dado], es: [datos, dato]}
  - {en: [business], pt: [negocio, negocios], es: [negocio, negocios]}
  - {en: [improvement, improve, improving], pt: [melhoria, melhorias, melhorar], es: [mejora, mejoras, mejorar]}
  - {en: [management, manage, managing], pt: [gestao, gerir, gerenciamento, gerenciar], es: [gestion, gestionar]}
  - {en: [requirement, requirements], pt: [requisito, requisitos], es: [requisito, requisitos]}
  - {en: [ai], pt: [ia], es: [ia]}
  - {en: [adoption, adopt], pt: [adocao, adotar], es: [adopcion, adoptar]}
  - {en: [implementation, implement, implementing], pt: [implantacao, implantar], es: [implantacion]}
  - {en: [project, projects], pt: [projeto, projetos], es: [proyecto, proyectos]}
  - {en: [customer, customers], pt: [cliente, clientes], es: [cliente, clientes]}
  - {en: [sales, sale, selling], pt: [vendas, venda, vender], es: [ventas, venta, vender]}
  - {en: [report, reports, reporting], pt: [relatorio, relatorios], es: [informe, informes]}
  - {en: [analysis, analyse, analyze], pt: [analise, analises, analisar], es: [analisis, analizar]}
  - {en: [training, train], pt: [treinamento, treinar, capacitacao], es: [capacitacion, formacion]}
  - {en: [recruitment, recruiting], pt: [recrutamento, recrutar], es: [reclutamiento, reclutar]}
  - {en: [hiring, hire], pt: [contratacao, contratar], es: [contratacion, contratar]}
  - {en: [budget, budgets], pt: [orcamento, orcamentos], es: [presupuesto, presupuestos]}
  - {en: [accounting], pt: [contabilidade], es: [contabilidad]}
  - {en: [invoice, invoices, invoicing], pt: [fatura, faturas, faturamento], es: [factura, facturas, facturacion]}
  - {en: [campaign, campaigns], pt: [campanha, campanhas], es: [campana, campanas]}
  - {en: [content], pt: [conteudo, conteudos], es: [contenido, contenidos]}
  - {en: [lesson, lessons], pt: [aula, aulas], es: [clase, clases]}
  - {en: [student, students], pt: [aluno, alunos, estudante, estudantes], es: [alumno, alumnos, estudiante, estudiantes]}
  - {en: [teaching, teach], pt: [ensino, ensinar], es: [ensenanza, ensenar]}
  - {en: [support], pt: [suporte, apoio], es: [soporte]}
