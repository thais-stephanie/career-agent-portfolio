# Rules on ROOTS, applied after `phrase_forms.root`. Each rule carries the
# pairs that prove it; `tests/unit/test_matching_v2_language.py` checks every
# pair lands on one root, and a rule without examples is refused at load.
morphology:
  - lang: pt
    strip_root_suffix: atiz
    why: "-atizar is the verb of the -acao noun: automatizar / automacao"
    examples: [[automatizar, automacao], [automatizados, automacao], [sistematizar, sistema]]
  - lang: pt
    strip_root_suffix: iz
    why: "-izar is the verb of the -izacao noun: otimizar / otimizacao"
    examples: [[otimizar, otimizacao], [organizar, organizacao]]

# Recorded so the reason they do NOT match is written down. Never used to
# match: a related concept is another preference, and only the person may
# add one.
non_automatic:
  - {relation: RELATED_CONCEPT, a: rpa, b: automation}
  - {relation: RELATED_CONCEPT, a: middleware, b: systems integration}
  - {relation: RELATED_CONCEPT, a: data engineering, b: data analysis}
  - {relation: RELATED_CONCEPT, a: digital transformation, b: ai adoption}
  - {relation: RELATED_CONCEPT, a: client relationship, b: stakeholder management}
  - {relation: BROADER, a: marketing, b: social media}
  - {relation: BROADER, a: finance, b: accounts payable}
  - {relation: NARROWER, a: payroll, b: human resources}
