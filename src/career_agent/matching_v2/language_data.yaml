# Rules on ROOTS, applied after `phrase_forms.root`. Each rule carries the
# pairs that prove it; `tests/unit/test_matching_v2_language.py` checks every
# pair lands on one root, and a rule without examples is refused at load.
morphology:
  - lang: pt
    strip_root_suffix: atiz
    why: "-atizar is the verb of the -acao noun: automatizar / automacao"
    examples: [[automatizar, automacao], [automatizados, automacao], [sistematizar, sistema]]
  - lang: pt
    strip_root_suffix: iz
    why: "-izar is the verb of the -izacao noun: otimizar / otimizacao"
    examples: [[otimizar, otimizacao], [organizar, organizacao]]

# Recorded so the reason they do NOT match is written down. Never used to
# match: a related concept is another preference, and only the person may
# add one.
non_automatic:
  - {relation: RELATED_CONCEPT, a: rpa, b: automation}
  - {relation: RELATED_CONCEPT, a: middleware, b: systems integration}
  - {relation: RELATED_CONCEPT, a: data engineering, b: data analysis}
  - {relation: RELATED_CONCEPT, a: digital transformation, b: ai adoption}
  - {relation: RELATED_CONCEPT, a: client relationship, b: stakeholder management}
  - {relation: BROADER, a: marketing, b: social media}
  - {relation: BROADER, a: finance, b: accounts payable}
  - {relation: NARROWER, a: payroll, b: human resources}

# STRUCTURE (ADR-0037, 2026-10-14). Function words that say how the words of
# a sentence relate, read by `matching_v2.structure`. Closed lists of ordinary
# grammar in each language; no profession, product or employer.
structure:
  # "A <prep> B": B is A's complement (`migracao de dados` is migration of
  # data; `dados de migracao` is data ABOUT migration).
  prepositions:
    # Not `to`: before a verb it is an infinitive (`work with customers to
    # onboard them`), and job adverts are full of those.
    en: [of, "on", about, for, from, into, with, by, regarding]
    pt: [de, da, do, das, dos, sobre, para, pra, com, por, pelo, pela, pelos, pelas, ao, aos]
    es: [de, del, sobre, para, con, por, al]
  coordinators: [and, or, e, ou, "y", o, "&", "/"]
  # Opening a sentence, these make its first noun phrase somebody else's
  # (`Our suppliers handle ...`). Second-person words cancel the reading.
  third_party_openers:
    en: [our, their, its, the, these, those, this, his, her]
    pt: [nosso, nossa, nossos, nossas, os, as, o, este, esta, estes, estas, esse, essa, esses, essas]
    es: [nuestro, nuestra, nuestros, nuestras, el, la, los, las, este, esta, estos, estas]
  second_person: [you, your, youll, youre, voce, voces, vc, tu, usted, ustedes]
  # A clause boundary inside one sentence: words on two sides of it are not
  # one phrase (`Requisitos: ... Local de reuniao`).
  # Not the colon, a parenthesis or a dash: in adverts they mostly introduce
  # the same item's detail (`integrations (APIs, webhooks)`), measured on
  # real postings.
  # ONE-WORD PREFERENCES (2026-10-14). A unit of an organisation: a word
  # right before one of these in English (`the sales team`), or after one
  # and a preposition in Portuguese and Spanish (`equipe de vendas`), names
  # a team, not the work the role does.
  team_nouns:
    en: ["team", "teams", "department", "departments", "org", "orgs", "organization",
         "organisation", "function", "functions", "leaders", "leadership", "colleagues",
         "counterparts", "partners", "stakeholders", "group", "groups", "unit", "units"]
    pt: ["equipe", "equipes", "time", "times", "area", "areas", "departamento",
         "departamentos", "setor", "setores", "lideranca", "liderancas", "gestores"]
    es: ["equipo", "equipos", "area", "areas", "departamento", "departamentos", "sector",
         "lideres"]
  # Words saying the role works WITH somebody (`partner with the sales team`).
  # A team named after one of these is somebody else's work.
  collaboration_markers:
    en: ["with", "alongside", "partner", "partners", "partnering",
         "collaborate", "collaborates", "collaborating", "liaise", "liaising", "interface",
         "closely", "assist", "assisting", "enable", "enabling", "serve",
         "serving", "supporting"]
    pt: ["com", "junto", "juntamente", "parceria", "colaborar", "colaborando", "interface"]
    es: ["con", "junto", "colaborar", "colaborando"]
  # English: a word right after these, or right before a determiner, is a
  # verb (`to support`, `support the launch`). One-word preferences only.
  verb_openers: ["to", "will", "can", "could", "would", "should", "may", "might", "must",
                 "help", "helps", "helping"]
  determiners: ["the", "a", "an", "our", "your", "their", "its", "his", "her", "this",
                "these", "those", "them", "it", "us", "each", "every", "all", "one",
                "another", "any", "some", "my"]
  clause_marks: ["|"]

# OTHER SENSES. A word with a second, common meaning in job adverts, and the
# words that show the second meaning is the one in use. Data, like the table
# above: an entry is a dictionary fact about a word, not about a posting.
other_senses:
  - {lang: pt, forms: [integracao, integracoes], sense: onboarding of new staff,
     cues: [boas vindas, novos colaboradores, recem contratados, onboarding, ambientacao]}
  - {lang: en, forms: [integration], sense: onboarding of new staff,
     cues: [onboarding, new joiners, welcome week]}
  - {lang: pt, forms: [campanha, campanhas], sense: internal or charity drive,
     cues: [vacinacao, doacao, doacoes, agasalho, sangue, beneficente, solidaria, solidario]}
  - {lang: en, forms: [campaign, campaigns], sense: internal or charity drive,
     cues: [vaccination, flu shot, blood drive, donation, donations, charity, fundraiser]}
  - {lang: pt, forms: [migracao, migracoes], sense: people moving,
     cues: [novo escritorio, nova sede, mudanca de sede, realocacao]}
  - {lang: en, forms: [migration, migrations], sense: people moving,
     cues: [office move, relocation, new office]}
  - {lang: en, forms: [lead, leads], sense: to lead people,
     cues: [lead a team, lead the team, lead our team, team lead, tech lead, lead engineer, lead by example]}
