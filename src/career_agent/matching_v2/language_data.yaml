  - {en: [consultative], pt: [consultiva, consultivas, consultivo, consultivos], es: [consultiva, consultivo]}

fixed_expression:
  - {en: [workflow, workflows], pt: [fluxo de trabalho, fluxos de trabalho], es: [flujo de trabajo, flujos de trabajo]}
  - {en: [requirements gathering], pt: [levantamento de requisitos], es: [levantamiento de requisitos]}
  - {en: [customer service], pt: [atendimento ao cliente, atendimento aos clientes], es: [atencion al cliente]}
  - {en: [social media], pt: [redes sociais, midias sociais], es: [redes sociales]}
  - {en: [payroll], pt: [folha de pagamento], es: [nomina]}
  - {en: [accounts payable], pt: [contas a pagar], es: [cuentas por pagar]}
