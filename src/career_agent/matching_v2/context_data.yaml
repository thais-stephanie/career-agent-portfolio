# What a part of an advert is FOR, from its heading or its own words
# (ADR-0037). Data, in three languages; no profession appears here.
#
# A heading is a short line with no sentence ending. Its context holds for
# every sentence under it until the next heading. A sentence under no heading
# takes a sentence cue when one fires, else OTHER: nothing is guessed from
# position.
