# THE ROLE IN ITS OWN VOICE. A sentence that speaks to the candidate or names
# the role is about the work even under a company or benefits heading the
# advert never closed (`Who We Are` ... `We are looking for a Deployment
# Lead`). It is read as of no known purpose, never set aside.
role_voice_cues:
  - you will
  - you ll
  - you re
  - you are
  - you have
  - your role
  - your day
  - we are looking for
  - we re looking for
  - we are hiring
  - we re hiring
  - this role
  - the role
  - in this role
  - responsible for
  - voce vai
  - voce ira
  - voce sera
  - voce tera
  - buscamos
  - procuramos
  - estamos buscando
  - estamos procurando
  - responsavel por
  - seras responsable
  - buscamos a

# A BENEFIT PROVES NO WORK UNLESS THE SENTENCE ITSELF ASSIGNS SOME (owner's
# decision, 2026-10-15). The heading says what a passage is FOR; it does not
# overrule a sentence that says the person hired will do or must know the
# work. Under a benefits heading a sentence is evidence only with a duty cue,
# the role being introduced, or the candidate as the subject of a verb that is
# not something given to them. The role's voice alone is not enough there:
# `you will receive`, `voce vai contar com`, `vas a tener` are the benefit.
# Doubt stays a benefit (no point). Company and condition headings keep the
# role-voice reading above.
benefit_duty:
  duty_cues:
    - responsible for
    - in charge of
    - accountable for
    - you will need to
    - you ll need to
    - you must
    - you are expected to
    - you re expected to
    - you will be expected to
    - you ll be expected to
    - responsavel por
    - responsaveis por
    - responsavel pela
    - responsavel pelo
    - responsaveis pela
    - responsaveis pelo
    - voce precisara
    - voce devera
    - responsable de
    - responsables de
    - a cargo de
    - deberas
    - tendras que
