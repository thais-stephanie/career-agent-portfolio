# =====================================================================
# ACTIVE COMPANY REGISTRY  (M1D)
#
# This file DRIVES COLLECTION. Editing it changes which companies and
# boards the next `career-agent collect` run touches. There is no
# hard-coded duplicate of this list in Python.
#
# Every entry earned its place the same way: a live probe of a public
# Greenhouse, Lever or Ashby board answered on `verified_at`. That probe
# is what makes the registry auditable -- the answer to "why is Career
# Agent monitoring this company?" is never "a list said so".
#
# Company and board are different things. One company with boards on two
# providers is ONE entry with two boards, never two companies.
#
# `hq_country` is a discovery and ranking signal ONLY. It is never
# geographic eligibility: a worldwide-remote role at a company anywhere
# is fully eligible, and a residents-only role at a company in a
# preferred market is not. M3 owns that question.
#
# No candidate-private data appears here. `discovery_source` records the
# signal that led us to the company, not anything about the candidate.
#
# The engineering validation set lives separately in companies.seed.yaml
# so provider regression tests keep a small, deliberately awkward corpus
# that does not move every time this registry grows.
# =====================================================================

schema_version: 1
purpose: curated_registry

