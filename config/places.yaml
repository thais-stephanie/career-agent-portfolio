# =====================================================================
# The place gazetteer.
#
# Turns `job.location_raw` -- whatever words the board happened to print --
# into ISO 3166-1 alpha-2 country codes and coarse regions, so a person can
# ask "postings in Brazil" without the query having to LIKE over free text.
#
# WHAT THIS IS NOT
# ----------------
# It is NOT a hiring-scope answer, and nothing derived from it may become one.
# CLAUDE.md invariant 3 keeps three questions apart:
#
#     hiring_scope                     where the employer will HIRE
#     work_environment.worksite        where the work is DONE
#     location_raw (this file)         what the board PRINTED
#
# A posting that says "San Francisco" tells you where the office is. It does
# not say the company will hire someone in Brazil, and no amount of parsing
# turns it into that claim. Eligibility stays with the geography gate.
#
# THE RESOLUTION RULE
# -------------------
# `career_agent.match.places` splits the string on separators and matches each
# token here, case- and accent-insensitively. Three kinds of entry:
#
#   regions      an explicit region word the board printed
#   countries    a country name or alias -> ISO alpha-2
#   cities       a city -> the country it is in
#
# SUBDIVISIONS RESOLVE NOTHING ON THEIR OWN, and that is deliberate rather
# than lazy. `CA` is California and it is also the ISO code for Canada; `IL`
# is Illinois and Israel; `CO`, `DE`, `GA`, `IN`, `LA`, `PA`, `TX` and a dozen
# more collide the same way. A rule that guessed would be wrong silently, on
# the most common strings in the corpus. So `subdivisions` only CONFIRMS a
# country another token already established, and a bare `CA` resolves to
# nothing.
#
# A token nobody here recognises resolves to nothing, and a posting with no
# resolved country is EXCLUDED by a country filter rather than included by it.
# Absence is never permission -- so the interface reports how many postings are
# unresolved rather than letting them vanish quietly.
# =====================================================================

schema_version: 1
reviewed_on: 2026-09-04

#: Region words boards print directly. The value is a region id; a posting may
#: carry several.
regions:
  worldwide: WORLDWIDE
  world wide: WORLDWIDE
  anywhere in the world: WORLDWIDE
  anywhere in world: WORLDWIDE
  global: WORLDWIDE
  anywhere: WORLDWIDE
  remote worldwide: WORLDWIDE
  # `fully remote` and `home based` used to sit here and were removed on
  # 2026-09-11: they answer the WORKSITE question, and a remote role is not
  # thereby a worldwide one. Reading them as WORLDWIDE let a location field
  # saying only that the job is remote open the geography gate.
