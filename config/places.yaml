# =====================================================================
# DISPLAY NAMES. Nothing here participates in resolution.
#
# The tables above answer "which code is this string?". These two answer
# "what do we call that code on screen?", which is a different question with
# a different failure mode: getting a name wrong is a cosmetic bug, getting a
# code wrong silently misfiles a posting.
#
# They live here rather than in the frontend because THIS file decides which
# codes can exist. A second list in JavaScript would drift from it the first
# time a country was added, and drift silently, since a missing name simply
# falls back to the code -- which is the state this fixed.
#
# `NO` is quoted for the reason given at the top of `country_regions`.
# =====================================================================

