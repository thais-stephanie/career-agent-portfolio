# =====================================================================
# The source catalogue.
#
# Which job sources this product can reach, and by what means. It lives in
# DATA and not in Python for the same reason `imitates_provider` does in the
# demo corpus: `tests/unit/test_provider_neutrality.py` forbids generic code
# from naming a vendor, and it is right to. Which sources exist is a property
# of the world, not of the collection layer.
#
# TWO FIELDS, TWO QUESTIONS
#
# `status` says by what MECHANISM a source is reached:
#
#   LIVE_INTEGRATION    an adapter exists AND has persisted real postings
#   MANUAL_IMPORT       the person may paste a URL or the text; we must not fetch
#   SEARCH_LINK         we can build a good query URL; the person opens it
#   UNAVAILABLE         no permitted stable mechanism, or terms unreadable
#
# `coverage` says how much of it a person can USE:
#
#   OPERATIONAL   retrieval has run; postings from it are in the corpus
#   PARTIAL       retrieval works and something expected is missing
#   BLOCKED       a first-party page forbids automated access -- see `reason`
#   UNSUPPORTED   no documented interface, or the terms could not be read
#   UNDOCUMENTED  reachable and measured; the vendor publishes no terms,
#                 so permission is UNDECLARED. Not a green light.
#   PLANNED       permitted, or apparently so, and NOT yet demonstrated
#
# The two were being conflated, and the conflation cost something: MANUAL_IMPORT
# covered both "the terms forbid us to fetch this" and "we have not written an
# adapter yet", so the matrix could not be used to decide what to build next.
# Vagas and Gupy were the same row colour and are completely different problems.
#
# OPERATIONAL AND PARTIAL ARE NOT CLAIMS THIS FILE GETS TO MAKE. Both assert
# that retrieval has RUN. `sources.resolve` downgrades either to PLANNED unless
# the corpus proves it -- the same treatment LIVE_INTEGRATION already gets.
#
# A BRAZILIAN PLATFORM IS NEVER OPERATIONAL WITHOUT A DEMONSTRATED RETRIEVAL.
# Not "the endpoint looks unauthenticated", not "the docs describe it as free".
# Until a bounded, authorised call has returned postings, it is PLANNED and
# `unblocked_by` says exactly what would change that.
#
# LIVE_INTEGRATION IS NOT A CLAIM THIS FILE GETS TO MAKE ALONE. It is checked
# at runtime against the provider registry and against the corpus: a source
# that names an adapter nobody registered, or that has persisted nothing, is
# reported as configured-but-unproven rather than live. Saying "live" about a
# source that has never returned a posting is the kind of claim this project
# exists not to make.
#
# `authorization` records WHY, and every one of them was read from a
# first-party page on the date in `docs/product/source-capability-matrix.md`.
# No entry here rests on a blog post or a "how to scrape X" article.
# =====================================================================

schema_version: 1
reviewed_on: 2026-09-04

