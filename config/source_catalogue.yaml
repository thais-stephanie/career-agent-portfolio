  # -- Brazil ------------------------------------------------------------
  # CORRECTED 2026-09-05. "NEVER CALLED" is no longer true: a bounded
  # read-only preflight ran against the candidate-facing feed, which is a
  # DIFFERENT surface from the documented employer API.
  - id: gupy
    name: Gupy
    region: br
    status: LIVE_INTEGRATION
    provider: gupy
    authorization: >-
      Two different surfaces, and only one was ever documented. The published
      developer API at `api.gupy.io` is employer-facing and requires a Bearer
      token. The candidate feed at `employability-portal.gupy.io` answers
      without authentication and is documented nowhere; its host serves no
      robots.txt at all, and `portal.gupy.io/robots.txt` is a different host
      whose empty `Disallow:` does not govern it. No authentication, CAPTCHA,
      access control or rate-limit header was encountered, and none was
      circumvented. Under the collection policy adopted 2026-09-09
      (`docs/decisions/ADR-0018`, `docs/product/collection-policy.md`) an
      undeclared public endpoint may be read, bounded and politely. That
      REVERSES the rule this file applied to Torre, and the reversal is
      recorded rather than quietly applied.
    note: >-
      The first Brazilian source this corpus has ever collected from, and the
      answer to its central weakness: on 2026-09-09, 211 of 19,485 open
      postings were located in Brazil. The feed declares 81,310. Two ceilings
      bound what a run reaches and they are different facts: the vendor
      refuses `offset` at 10,000, and this product's own shared page cap of 50
      pages of 100 binds first at 5,000 per partition. So `remote` (2,115)
      fits whole, `hybrid` (5,970) does not, and `on-site` (72,682) is
      reachable only a slice at a time and is never collected by default.
    coverage: PARTIAL
    #: The same answer, for the person reading the panel.
    reason_plain: >-
      Brazilian jobs, with the whole advert and a real city and state on each one. We read the
      remote and hybrid listings; the on-site list is far too large to read whole, so this is a
      window on Gupy rather than all of it.
    reason: >-
      Measured 2026-09-05 and collected 2026-09-09. `GET /api/v1/jobs` returns
      200 with `data` and `pagination`, and the FULL description arrives in the
      listing, so there is no detail request at all. `workplaceType` and
      separate `city`, `state`, `country` map onto the three questions
      invariant 3 keeps apart, which is what lets `gates.structured_geography`
      resolve these postings without anybody claiming a hiring scope: this
      adapter declares `publishes_hiring_scope: false`, because `country:
      Brasil` says where the work is. `jobUrl` is on the employer's own
      `*.gupy.io` subdomain, preserving employer destination separately from
      source provenance. Two traps are measured
      and handled: `offset` is refused with 400 at 10,000 and above rather than
      clamped, so no single query reaches more than 10,000 of the 81,310 and
      the walk partitions by `workplaceType`; and `pagination.total` returns
      the page size instead of the real total when `limit=100`, so the count
      comes from a separate `limit=10` probe. Stated here as well as in the
      note because a DOWNGRADED row shows this sentence and not that one, and
      what a feed does not reach is not a detail to lose on the way.
    unblocked_by: >-
      Nothing. Collected, and the remaining limits are the two ceilings in the
      note above rather than a permission question.

  - id: programathor
    name: Programathor
    region: br
    status: LIVE_INTEGRATION
    provider: programathor
    authorization: >-
      `programathor.com.br/robots.txt`, read first-party 2026-09-09: one
      `User-agent: *` group disallowing exactly `/admin/`, `/user/`, `/users/`
      and `/company/`. Neither `/jobs` nor a posting page is among them, and
      the same file DECLARES A SITEMAP, which is an affirmative aid to a
      crawler rather than the absence of a ban. Nothing was bypassed and no
      access control was met. This would have been permitted under the
      stricter policy that preceded ADR-0018.
    note: >-
      The most expensive source here per posting, and the richest per posting
      it manages to serve. The listing carries no description, so each posting
      costs its own request, and a material fraction of the posting pages
      answer HTTP 500 -- deterministic per URL, four consecutive requests for
      one URL returning 500 four times, so neither a rate limit nor transient.
      The rate was measured three times and moved each time (3 of 6, 12 of 15,
      then 106 of 112 over eight pages), so it is reported per run rather than
      assumed and the largest sample is the one to believe. A refused posting
      is also RETRIED, because the shared fetcher retries a 5xx, which is right
      for a transient failure and wrong for this one. First corpus run: 112
      listed, 106 served and stored, 72 new employers, 28 stating pay with both
      a currency and a period. What buys that back is
      `baseSalary` with a currency AND a period, and an `employmentType` that
      on a Brazilian board distinguishes PJ (`CONTRACTOR`) from CLT-shaped work
      (`FULL_TIME`) -- the structured contract signal `contract_regime` has
      been waiting for since the column existed.
    coverage: PARTIAL
    reason_plain: >-
      Brazilian developer jobs, with the whole advert and, unusually, what they pay in reais per
      month. About half the postings this board lists cannot be opened at all right now, which is
      a fault on their side rather than ours, so we read a window of what works.
    reason: >-
      Collected 2026-09-09. Every posting page publishes schema.org
      `JobPosting` structured data -- a contract a site fills in for machines,
      not markup to be scraped -- carrying `title`, the whole `description`,
      `datePosted`, `validThrough`, `baseSalary` with `currency` and
      `unitText`, `employmentType`, a `PostalAddress` whose `addressCountry` is
      a bare ISO code, and `hiringOrganization.sameAs` naming the employer's
      own domain. The JSON must be parsed with `strict=False`: the vendor emits
      raw newlines inside the description string, and a strict parser drops
      every posting on the source with the block sitting there the whole time.
      `publishes_hiring_scope` is false -- `addressCountry: BR` is where the
      work is, the same reading the Gupy row argues.
    unblocked_by: >-
      Nothing on our side. What limits it is the vendor's own 500 rate and the
      one-request-per-posting cost, both of which are in the note above.

