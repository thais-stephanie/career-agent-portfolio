  # -- Global, not wired -------------------------------------------------
  # CORRECTED 2026-09-05 from a bounded preflight. See
  # docs/product/source-evidence-2026-09-05.md.
  #
  # The old row said the CxS endpoints were unusable. That conflated two
  # different facts: the vendor does not DOCUMENT them, and they do not WORK.
  # Only the first is true. They answer, without authentication, and robots.txt
  # does not mention them.
  - id: workday
    name: Workday (CxS)
    region: global
    #: CHANGED 2026-09-10, from UNAVAILABLE. The adapter exists, and the two
    #: things that had to happen first were not writing code: ADR-0018 settled
    #: the permission, and `scan-career-sites` resolved real board identities
    #: from employers' own careers pages. Normal production collection now
    #: proves persisted inventory; the generated matrix verifies that claim.
    status: LIVE_INTEGRATION
    provider: workday
    authorization: >-
      PERMITTED, and this row said the opposite until ADR-0018.

      No first-party page documents `/wday/cxs/...`, the documented Workday API
      is authenticated SOAP, the endpoint answers without authentication, and
      robots.txt does not forbid it. Every one of those facts is unchanged. The
      SENTENCE that used to follow them -- "silence is not permission" -- was
      invariant 2 applied to the wrong question, and ADR-0018 reversed it on
      2026-09-09: invariant 2 is about what a POSTING says about a PERSON, and
      reading it as a rule about network requests borrowed the weight of a
      promise to the candidate and spent it on a courtesy to a vendor who had
      not asked.

      For COLLECTION, silence is now permission under five limits, and none of
      the five is met here: nothing bypasses authentication, a CAPTCHA, an
      access control, an explicit block or a rate limit. The sentence that used
      to end this paragraph -- "what remains is that nobody has built it" -- was
      true until 2026-09-10 and is not any more.
    coverage: OPERATIONAL
    reason_plain: >-
      Jobs from the verified Purple and Teach For America boards are collected with full
      descriptions. The separate TFA Pre-Service board currently has no openings.
    reason: >-
      Normal production collection on 2026-09-10 persisted 73 Purple and nine
      TFA Careers postings, with full detail and no failures. TFA Pre-Service
      successfully returned zero. Both hosts' robots policies were verified
      again. Coverage is limited to employer-published board identities.
    note: >-
      Three pagination traps are measured and must be designed for, not
      discovered: `total` is only true on the first page; `offset >= total`
      silently returns page zero again, so a walk that stops on an empty page
      never terminates; and `limit` above 20 is refused with 400 rather than
      clamped.
    unblocked_by: >-
      Refresh these verified boards normally. Register additional boards only
      from employer-published complete identities; never guess a tenant or site.

  # CORRECTED 2026-09-05. The adapter and the collector now exist and have run
  # against the live feed, so the old row -- "it is not built yet" -- had
  # stopped being true. What has NOT changed is the terms gap, and promoting a
  # source because we finally wrote its adapter would be exactly backwards.
  - id: weworkremotely
    name: We Work Remotely
    region: global
    status: LIVE_INTEGRATION
    provider: wwr
    authorization: >-
      robots.txt is permissive and affirmatively allows job pages, and the RSS
      feed is a deliberate first-party syndication channel. `/terms` and
      `/terms-of-service` both answer 403 to an automated reader and were never
      read, which is recorded rather than assumed away.
    note: >-
      The feed is a WINDOW, not a board: about thirteen to fifteen of the most
      recent postings per feed, no pagination parameter and no archive.
      Collecting it repeatedly accumulates postings over time and never yields
      a complete board, so nothing may present it as one.
    coverage: PARTIAL
    #: The same answer, for the person reading the panel.
    reason_plain: >-
      We Work Remotely is collected and reads the whole posting, not a summary. It is a window
      onto the most recent openings rather than the whole board, so it is never complete.
    reason: >-
      Adapter and collector built 2026-09-05 and proven against the live feed:
      25 new on the first pass, then 0 new and 25 seen again on the second,
      with descriptions averaging 5,053 characters. Three dedup rules rather
      than four -- a WWR posting links to WWR, so the origin-URL rule has
      nothing to resolve against. Production inventory is persisted; the
      generated matrix measures the current corpus. Feed-window coverage
      remains partial even when every returned posting is collected.
    unblocked_by: >-
      `career-agent collect-wwr --db data/m1d2/career.db`. Separately, and
      unrelated to the mechanism: one successful read of the terms page.

  # Added 2026-09-05. Listed BEFORE it can run, because a source this product
  # can reach and deliberately does not is a fact the panel should carry.
  - id: jooble
    name: Jooble
    region: global
    status: LIVE_INTEGRATION
    provider: jooble
    authorization: >-
      A documented public REST API, reached with a key the vendor issues on
      request. Their documentation states the limit plainly: 500 requests per
      key, for the LIFETIME of the key, not per day.
    note: >-
      A key belongs to ONE country. Their documentation is explicit -- "Each
      Jooble domain (country) requires its own unique REST API key" -- and
      which market a key was issued for cannot be read from the key. So
      `JOOBLE_DOMAIN` is required configuration with no default, and nothing
      here guesses it. The credential configured on this machine was issued on
      `jooble.org`, which their documentation says is the UNITED STATES market.
      A Brazilian search is a SEPARATE regional credential and a separate row;
      it is not `location=Brazil` sent to a US key.
    coverage: PLANNED
    #: The same answer, for the person reading the panel.
    reason_plain: >-
      Jooble is wired and switched off. Your key can be used 500 times ever, so this product
      will not spend one without being asked. The key set up here is for the United States
      market, so it will not find Brazilian jobs however the search is worded.
    reason: >-
      The adapter, a ledger that refuses a request BEFORE it is sent, and a
      redacted-URL path so the key in the URL cannot reach an error message or
      a cache filename. ONE live request has been made, on 2026-09-06, and the
      documented contract held: 20 rows, every one carrying a date and a
      location, `totalCount` 2579 for a query that returns 20.
      -> `docs/product/source-evidence-2026-09-06-jooble.md`

      Production collection is disabled under the lifetime-quota policy.
      The bounded research request was a canary, not production inventory.
      The response carries a SNIPPET of 286 to 329 characters
      rather than the employer's description, and this product's matcher reads
      bodies -- so a Jooble posting would score as thin on evidence rather
      than genuinely thin. And its only origin pointer is a board NAME rather
      than a URL, so identity cannot be resolved the way ADR-0013 resolves a
      Speedrun sighting, and every collected posting risks becoming a
      duplicate of one already held.
    unblocked_by: >-
      A decision about snippets: either a rule that a snippet-sourced posting
      is presented as UNSCOREABLE rather than scored on 300 characters, or a
      documented detail endpoint to fetch the body from. Brazilian coverage
      needs a Brazilian key, modelled as its own source row.

  # CORRECTED 2026-09-05, and the correction is not the expected one. The old
  # row recorded a 403 and a self-contradicting robots.txt. Re-measured, the
  # endpoint returns 200 and publishes its own terms inside the response.
  - id: remoteok
    name: Remote OK
    region: global
    status: LIVE_INTEGRATION
    provider: remoteok
    authorization: >-
      `remoteok.com/robots.txt`, read first-party 2026-09-09. The generic group
      is `User-agent: *` with `Allow: /`, `Crawl-delay: 1` and
      `Content-Signal: search=yes,ai-train=no,use=reference` -- this product
      builds no third-party index, trains nothing, and uses postings by
      reference. **`User-agent: ClaudeBot` carries `Disallow: /`**, and the
      agent that wrote this adapter IS ClaudeBot, so ZERO live requests were
      made from this repository: the fixture predates the work and the first
      live call is the owner's. Same handling as Get on Board, which set the
      precedent. Separately, the API's own terms ride in element ZERO of every
      response and are a grant with three conditions -- link back to the Remote
      OK URL, credit Remote OK, do not use the logo. All three are structural
      rather than promised.
    note: >-
      Built after being refused once, and the refusal was right about the
      mechanism and wrong about the conclusion. It publishes NO origin pointer:
      `apply_url` is byte-identical to `url` on every row, so ADR-0013 identity
      has nothing to resolve against and a posting also carried by an employer's
      own board becomes two rows. Himalayas shipped on 2026-09-07 with exactly
      that gap, under a trade written into its collector -- two visible rows for
      one job is a smaller harm than one invisible job -- and the same trade
      applies unchanged. What it adds is what this corpus lacks most: the
      captured window carries a hospitality job in Ipojuca tagged `non tech`
      beside a customer support role, which is the inventory a career changer
      needs and an engineering-heavy corpus does not have.
    coverage: PARTIAL
    reason_plain: >-
      Remote jobs from around the world, including non-technical ones, with the whole advert. It
      is a window of what the board is showing now rather than everything it has ever listed, so
      collecting it repeatedly is how it fills up.
    reason: >-
      One request returns the window; there is no paging parameter and none was
      invented. Full bodies at 2,000-6,000 characters, a stable numeric id, an
      RFC 3339 date and the employer's name. `salary_min` and `salary_max`
      arrive as bare integers with NO CURRENCY anywhere in the record, so they
      are archived and never read: nothing here converts between currencies and
      a number with an invented unit is worse than no number.
      `publishes_hiring_scope` is false -- `location` is where the work is, and
      it is empty on most rows, which is stored as nothing rather than as
      `Remote`.
    unblocked_by: >-
      Nothing on our side. `career-agent collect-remoteok`, and the first live
      call is the owner's because this repository's agent is named in the
      robots file.

