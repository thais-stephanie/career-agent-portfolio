    #: The same answer, for the person reading the panel.
    reason_plain: >-
      Greenhouse retrieval is complete for the responding registered boards. More jobs require
      more verified company boards. Some salary custom fields do not state their pay period.
    reason: >-
      COLLECTOR COMPLETE FOR KNOWN REGISTRY: the last full family run attempted
      122 boards, with 121 responding, one NOT_FOUND, nine legitimate empty boards
      and 11,134 observed, parsed and persisted full descriptions. No malformed
      postings were skipped. Growth requires registry discovery. Some salary
      custom fields lack a period; explicit description fallback is preserved.
      Optional `?pay_transparency=true` enrichment is separate from listing
      completeness and is not required to fetch the known inventory.
    unblocked_by: >-
