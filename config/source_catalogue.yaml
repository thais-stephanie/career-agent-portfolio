    reason: >-
      Read-only REST API, verified by a bounded retrieval on 2026-09-05: 2
      pages, 100 postings, 82 new and 18 already held from the employers' own
      boards. The whole feed is not reachable. Paging stops at page 200 of 50,
      so 10,050 postings are servable of the 18,479 this scope reports, and a
