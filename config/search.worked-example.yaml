  # -- Named tools the profile actually uses --------------------------
  tool_stack:
    label: "Adjacent operational tools"
    responsibility: business_systems_administration
    patterns: ["stripe", "deel", "supabase", "airtable", "netlify", "gong", "salesforce",
               "slack api", "notion api", "google workspace", "docusign", "greenhouse",
               "workday", "bamboohr", "rippling", "quickbooks", "zendesk",
               "intercom", "segment", "customer data platform", "cdp", "snowflake", "dbt"]

  # -- Negative: off-target work -------------------------------------
  quota_carrying_sales:
    label: "Quota-carrying sales"
    responsibility: quota_carrying_sales
    negation_sensitive: true
    patterns: ["carry a quota", "carrying a quota", "quota carrying", "sales quota",
               "revenue quota", "close deals", "closing deals", "hit your number",
               "book of business", "meta de vendas", "bater meta"]

  cold_outbound:
    label: "Cold calling / outbound prospecting"
    responsibility: cold_outbound_prospecting
    patterns: ["cold calling", "cold call", "cold outreach", "cold email",
               "outbound prospecting", "prospecting", "sdr", "bdr",
               "prospeccao", "ligacao fria"]
    negation_sensitive: true

  account_executive_work:
    label: "Account executive responsibilities"
    responsibility: account_management
    patterns: ["account executive", "manage a book", "upsell", "cross sell",
               "renewals quota", "account management"]

  sales_development:
    label: "Sales development"
    responsibility: cold_outbound_prospecting
    patterns: ["sales development", "business development representative",
               "sales development representative", "qualify inbound leads"]

  presales_demo:
    label: "Pre-sales demos"
    responsibility: presales_solution_consulting
    negation_sensitive: true
    patterns: ["product demo", "product demos", "demo the product", "presales", "pre sales",
               "pre-sales", "sales cycle support", "support the sales cycle"]

  rfp_ownership:
    label: "RFP ownership"
    responsibility: presales_solution_consulting
    patterns: ["rfp", "request for proposal", "rfi", "security questionnaire", "tender"]

  heavy_engineering:
    label: "Deep software engineering as the core"
    responsibility: full_software_engineering
    negation_sensitive: true
    patterns: ["distributed systems", "microservices architecture", "kubernetes",
               "scalable backend", "low latency", "high throughput", "compiler",
               "kernel", "c++", "rust", "golang", "production services at scale"]

  algorithmic_depth:
    label: "Algorithmic / CS depth"
    responsibility: full_software_engineering
    patterns: ["algorithms and data structures", "computer science degree",
               "bs in computer science", "computational complexity",
               "machine learning engineer", "deep learning"]

  ml_research:
    label: "ML research"
    responsibility: full_software_engineering
    patterns: ["research scientist", "publish papers", "phd", "novel architectures",
               "model research"]

  model_training:
    label: "Model training"
    responsibility: full_software_engineering
    patterns: ["train models", "training models", "fine tune models", "pytorch",
               "tensorflow", "model training pipeline"]

  product_development:
    label: "Customer-facing product software development"
    responsibility: full_software_engineering
    negation_sensitive: true
    patterns: ["ship product features", "customer facing product", "product roadmap delivery",
               "user facing features", "our core product codebase"]

  people_management:
    label: "People management"
    responsibility: people_management
    negation_sensitive: true
    patterns: ["direct reports", "manage a team of", "hire and develop", "performance reviews",
               "people manager", "headcount", "gestao de pessoas", "liderar equipe"]

  manual_reporting_only:
    label: "Manual reporting"
    responsibility: reporting_and_dashboards
    patterns: ["manual reporting", "compile spreadsheets", "maintain spreadsheets"]

  quota_administration:
    label: "Quota and commission administration"
    responsibility: account_management
    patterns: ["commission calculation", "quota administration", "territory planning",
               "compensation plans for reps"]

  selling_hubspot:
    label: "Selling HubSpot / agency sales"
    responsibility: quota_carrying_sales
    patterns: ["sell hubspot", "selling hubspot", "hubspot partner sales", "grow our agency",
               "new business for the agency"]

  agency_account_management:
    label: "Agency account management"
    responsibility: account_management
    patterns: ["client accounts", "account manager for clients", "agency clients",
               "client relationships"]

  campaign_execution_only:
    label: "Campaign / content execution"
    responsibility: responsibility_other
    patterns: ["copywriting", "content calendar", "social media posts", "campaign execution",
               "brand voice", "blog posts", "seo content"]

  content_production:
    label: "Content production"
    responsibility: responsibility_other
    patterns: ["produce content", "editorial calendar", "content marketing"]

  onsite_required:
    label: "Onsite presence"
    responsibility: responsibility_other
    patterns: ["on site", "onsite", "in office", "in-office", "hybrid schedule",
               "days per week in the office", "presencial", "hibrido"]
    negation_sensitive: true

  frequent_travel:
    label: "Frequent travel"
    responsibility: responsibility_other
    patterns: ["travel up to", "frequent travel", "travel required", "extensive travel",
               "travel to client sites", "willingness to travel",
               "disponibilidade para viagens", "viagens frequentes"]
    negation_sensitive: true

# ---------------------------------------------------------------------
# 5. PROMINENCE
#
# How central a signal is. Computed deterministically -- never guessed.
# ---------------------------------------------------------------------
prominence:
  # A hit in the title, or under a responsibilities-style heading, is PRIMARY.
  primary_fields: ["title"]
  primary_headings: ["responsibilities", "what you'll do", "what you will do",
                     "the role", "your impact", "day to day", "about the role",
                     "responsabilidades", "o que voce vai fazer", "sobre a vaga",
                     "atividades", "suas atividades"]
  # Repeated in the body, or found under a requirements heading.
  secondary_min_hits: 2
  secondary_headings: ["requirements", "qualifications", "what we're looking for",
                       "must have", "you have", "skills",
                       "requisitos", "qualificacoes", "o que buscamos",
                       "pre-requisitos", "habilidades"]
  # Anything else is INCIDENTAL.

# ---------------------------------------------------------------------
# 6. BOOLEAN SCREENING
#
# Applied BEFORE scoring and before any inference. A job that fails
# screening is BLOCKED on screening grounds -- distinct from being
# ineligible (ADR-0004).
# ---------------------------------------------------------------------
screening:
  # Every group must be satisfied. Within a group, ANY signal suffices.
  required_any_groups:
    - id: core_work
      label: "Some form of systems, automation or integration work"
      any_of: [workflow_automation, api_integration, system_integration, ipaas,
               crm_architecture, hubspot_platform, gtm_systems_work,
               business_systems_platform, internal_tooling, data_sync,
               applied_ai_workflow, business_process_design, data_modeling,
               operational_analytics, customer_implementation, solution_configuration,
               lead_routing, revops_infrastructure, scripting]

  # Every listed signal must be present. Empty by default: a hard AND over
  # keywords is how good postings get discarded before anyone reads them.
  required_all: []

# ---------------------------------------------------------------------
# 7. ELIGIBILITY BLOCKERS
#
# The ONLY thing that makes a job ineligible. These are unambiguous,
# verbatim eligibility statements -- never a bare keyword. A blocker
# must quote the sentence it fired on.
#
# `absence is never permission`: a posting that says nothing about where
# it hires is UNRESOLVED, never eligible (ADR-0004).
# ---------------------------------------------------------------------
eligibility:
  candidate_country: BR
  candidate_country_label: "Brazil"

  blockers:
    - id: us_residence_required
      label: "Must reside in the United States"
      gate: geography
      patterns: ["must reside in the united states", "must be located in the us",
                 "must be located in the united states", "must live in the united states",
                 "us based candidates only", "based in the us only",
                 "us only", "usa only", "united states only",
                 "must be based in the united states",
                 "candidates must be located within the united states",
                 "open to us residents only",
                 "must be physically located in the united states"]
      negation_sensitive: true

    - id: us_work_authorization_required
      label: "US work authorization required"
      gate: work_authorization
      patterns: ["must be authorized to work in the us",
                 "must be authorized to work in the united states",
                 "us citizenship required", "must be a us citizen",
                 "citizenship is required", "green card holder",
                 "we do not sponsor", "no visa sponsorship",
                 "without sponsorship"]
      negation_sensitive: true

    - id: security_clearance_required
      label: "Security clearance required"
      gate: clearance
      patterns: ["security clearance", "ts/sci", "top secret clearance",
                 "active clearance", "public trust clearance"]
      negation_sensitive: true

    - id: onsite_incompatible
      label: "Onsite presence in an incompatible location"
      gate: worksite
      patterns: ["must be in the office", "fully onsite", "100% onsite",
                 "this is an in office role", "5 days a week in the office",
                 "relocation is required", "must relocate"]
      negation_sensitive: true

    - id: travel_incompatible
      label: "Travel beyond tolerance"
      gate: travel
      patterns: ["travel up to 50%", "travel up to 60%", "travel up to 75%",
                 "50% travel", "60% travel", "75% travel", "extensive travel",
                 "frequent international travel", "travel 3 weeks per month",
                 "travel to customer sites weekly"]
      negation_sensitive: true

  # Regions the candidate can be hired from. An explicit hiring scope that
  # includes none of these is a geography FAIL; an absent scope is
  # UNRESOLVED, never PASS.
  eligible_scopes: [WORLDWIDE, LATAM, AMERICAS]
  eligible_countries: [BR]

  # Phrases that positively OPEN the geography gate.
  positive_scope_patterns:
    WORLDWIDE: ["work from anywhere", "fully remote worldwide", "remote worldwide",
                "anywhere in the world", "globally remote", "hire globally",
                "remote - global", "location independent", "anywhere globally"]
    LATAM: ["latin america", "latam", "south america", "america latina",
            "brazil", "brasil", "remote in brazil", "anywhere in latam"]

# ---------------------------------------------------------------------
# 8. SCORING
#
# Six components, maximum 100. Every component is bounded and every
# point is traceable to a named signal and a quote.
#
# The LLM never writes here. Local enrichment is displayed beside the
# score and never inside it.
# ---------------------------------------------------------------------
scoring:
  components:


    responsibilities:
      max: 25
      label: "Responsibilities and experience alignment"
      # Each signal contributes `weight`, scaled by prominence, then the
      # component is capped at `max`.
      prominence_multipliers: {PRIMARY: 1.0, SECONDARY: 0.7, INCIDENTAL: 0.35}
      weights:
        crm_architecture: 6
        gtm_systems_work: 6
        business_systems_platform: 6
        business_process_design: 5
        requirements_translation: 4
        internal_tooling: 4
        operational_analytics: 3
        data_modeling: 3
        data_quality: 3
        customer_implementation: 3
        solution_configuration: 3
        governance: 2
        technical_enablement: 2
        documentation_practice: 2
        lifecycle_workflow: 2
        revops_infrastructure: 4
        lead_routing: 3
        data_enrichment: 2

    technologies:
      max: 20
      label: "Technologies and software alignment"
      prominence_multipliers: {PRIMARY: 1.0, SECONDARY: 0.8, INCIDENTAL: 0.5}
      weights:
        hubspot_platform: 8
        ipaas: 7
        custom_objects: 3
        private_apps: 3
        tool_stack: 3
        scripting: 3

    automation_integration:
      max: 15
      label: "Automation, API and integration signals"
      prominence_multipliers: {PRIMARY: 1.0, SECONDARY: 0.8, INCIDENTAL: 0.5}
      weights:
        workflow_automation: 6
        api_integration: 6
        system_integration: 5
        data_sync: 4
        applied_ai_workflow: 4

    seniority:
      max: 10
      label: "Seniority alignment"
      # The level of the ADVERTISED ROLE, read from the title first and the
      # body second. Five values; `MANAGER` and `DIRECTOR` were members once
      # and resolve to LEAD now, because a title says nothing reliable about
      # whether a job manages people and that is its own dimension.
      # STAFF and PRINCIPAL joined the vocabulary on 2026-09-07. They are
      # the individual-contributor grades ABOVE senior and they used to
      # read as SENIOR, which is how post-senior architecture roles
      # reached the top of a list asking for senior execution work.
      #
      # Priced low rather than at zero: this search wants mid-to-senior
      # work, and a staff role is further from that than a lead role is
      # close to it. A level absent from this list scores zero -- see
      # `SeniorityComponent.points_for` -- so naming them is what makes
      # the number a decision instead of an omission.
      points: {INTERN: 0, JUNIOR: 3, MID: 9, SENIOR: 10, STAFF: 4,
               PRINCIPAL: 2, LEAD: 8}
      # What a reading with NO evidence is worth. The fallback level is MID,
      # so leaving this at the MID rate would pay 9 points for silence:
      # absence buying permission, in the dimension where it is least visible.
      unevidenced: 0

    compensation_contract:
      max: 5
      label: "Compensation and contract preference"
      # Salary is a PREFERENCE. A posting with no salary scores the
      # `salary_unknown` value -- it is never rejected for silence.
      salary_meets_target: 3
      salary_below_target: 0
      salary_unknown: 2
      contract_preferred: 2
      contract_unknown: 1
      contract_unwanted: 0

  # Subtracted after the components are summed. The total floors at 0.
  soft_penalties:
    prominence_multipliers: {PRIMARY: 1.0, SECONDARY: 0.6, INCIDENTAL: 0.2}
    weights:
      quota_carrying_sales: 25
      cold_outbound: 25
      account_executive_work: 15
      sales_development: 20
      presales_demo: 12
      rfp_ownership: 8
      heavy_engineering: 18
      algorithmic_depth: 12
      ml_research: 15
      model_training: 12
      product_development: 12
      people_management: 15
      manual_reporting_only: 8
      quota_administration: 8
      selling_hubspot: 20
      agency_account_management: 10
      campaign_execution_only: 10
      content_production: 8
      onsite_required: 10
      frequent_travel: 10

# ---------------------------------------------------------------------
# 9. DATA CONFIDENCE
#
# Separate from the match score, and never multiplied by it (ADR-0004).
# It answers "how much of this posting do we actually know?"
# ---------------------------------------------------------------------
confidence:
  components:
    description_present:     {points: 25, label: "Full description text available"}
    description_substantial: {points: 15, min_chars: 1200, label: "Description is substantial"}
    location_stated:         {points: 12, label: "Location stated"}
    hiring_scope_explicit:   {points: 13, label: "Hiring scope explicitly stated"}
    employment_type_known:   {points: 10, label: "Employment type known"}
    salary_known:            {points: 10, label: "Compensation stated"}
    seniority_determinable:  {points: 8,  label: "Seniority determinable from the body"}
    posted_date_known:       {points: 7,  label: "Posting date known"}

# ---------------------------------------------------------------------
# 10. PREFERENCES AND THRESHOLDS
# ---------------------------------------------------------------------
preferences:
  remote:
    accepted_work_models: [REMOTE, HYBRID]
    require_remote: false

  contract:
    preferred: [FULL_TIME_EMPLOYEE, CONTRACTOR_B2B, EOR]
    unwanted: []

  seniority:
    preferred: [MID, SENIOR, LEAD]

  travel:
    # Percentage of time. Above this, `travel_incompatible` may fire.
    max_tolerated_pct: 15

  compensation:
    # PLACEHOLDER. The real target belongs in config/search.local.yaml,
    # which is gitignored. Compensation is a preference worth at most 5
    # points and is NEVER an eligibility blocker.
    target_monthly_amount: 0
    currency: USD
    period: MONTH
    # PERIOD is normalised for you: a posting stating an annual figure is
    # compared per month (or the reverse), because twelve months to a year is
    # arithmetic rather than an observation. The card's note shows the working.
    # An HOURLY figure is never converted -- that would need an assumed
    # full-time week, which no posting states -- and scores `salary_unknown`.
    #
    # CURRENCY is not, unless you say when you looked it up. A rate here is
    # applied ONLY when `conversion_rates_dated` also carries the date the rate
    # was recorded; the note then shows the rate, the date and both sides of
    # the arithmetic. A rate WITHOUT a date is refused, not used: the posting
    # scores `salary_unknown` and says the rate is undated. With no rate at all
    # for the posting's currency, `salary_unknown` as well.
    #
    #   conversion_rates: {USD: 5.4}        # BRL per USD
    #   conversion_rates_dated: "2026-09-03"
    conversion_rates: {}
    conversion_rates_dated: null

  recency:
    # Jobs older than this are shown but marked stale.
    fresh_days: 14
    stale_days: 45

thresholds:
  # At or above this, a job is worth a human look.
  shortlist_min_score: 55
  # Only jobs at or above this may be sent to the LOCAL model. Deterministic
  # triage always runs first; the model never sees the whole corpus.
  local_ai_min_score: 60
  # Below this, jobs are hidden by default (still queryable).
  display_min_score: 0
  # Bands are a LABEL for the score, not a second opinion about it. They are
  # never combined with eligibility (ADR-0004): a STRONG job whose geography
  # gate failed is still displayed as blocked.
  fit_bands:
    STRONG: 75
    GOOD: 55
    MODERATE: 35
  # Data confidence gets the same treatment: a band for reading, computed
  # from the same number the UI already shows.
  confidence_bands:
    HIGH: 70
    MEDIUM: 45

# ---------------------------------------------------------------------
# 11. SOURCES
#
# Priority order, highest first. `enabled: false` means the collector
# will not run it. A source whose authorization is unverified stays
# disabled -- uncertainty is never resolved by writing a scraper.
# ---------------------------------------------------------------------
sources:
  priority: [ats_structured, official_api, official_mcp, rss, public_html, manual_import]
  enabled:
    greenhouse:    {enabled: true, access: ats_structured, region: global}
    lever:         {enabled: true, access: ats_structured, region: global}
    ashby:         {enabled: true, access: ats_structured, region: global}
    manual_import: {enabled: true, access: manual_import, region: any}
  # Everything else is listed, dated and justified in
  # docs/product/source-capability-matrix.md.

regions:
  target: [WORLDWIDE, LATAM, AMERICAS]
  # EMEA roles that hire internationally are welcome; the geography gate
  # decides per posting, not per region label.
  opportunistic: [EMEA, EU]
