# =====================================================================
# Search configuration -- the editable heart of the personal job agent.
#
# Everything the matcher believes about "work I want" lives in THIS FILE.
# No preference, keyword, weight or threshold is hard-coded in Python.
#
# THREE ROLES, one schema (ADR-0006):
#
#   config/search.starter.yaml         COMMITTED, GENERATED  neutral
#   config/search.worked-example.yaml  COMMITTED             a real search
#   config/search.local.yaml           GITIGNORED            yours
#
# `search.example.yaml` no longer exists. It was renamed because "example"
# read as "the default", and it is not one: the worked example is SOMEBODY'S
# REAL SEARCH -- business systems, automation and integration work, a
# residence country and a set of hiring scopes. Starting from it is a
# deliberate choice (`career-agent setup --example`), never the default.
#
# `career-agent setup` starts from the STARTER, which is generated by
# `scripts/make_starter_config.py` and holds the machinery with every phrase,
# title, country, blocker and preference taken out. Nothing about anybody.
#
# What the worked example does NOT hold: a compensation figure, an employer
# name, or any career history. Those belong in the local file, which is
# gitignored by pattern rather than by name.
#
# Unlike `profile.local.yaml`, a missing local file here is NOT an error:
# the example is a complete, usable configuration. The resolved path is
# always reported by `career-agent search-config` and shown in the web UI
# header, so the fallback is announced rather than silent.
#
# CHANGING THIS FILE:
#   Bump `config_version`. Scores are stored against the version that
#   produced them, so an old score is never silently reinterpreted under
#   new weights. Re-score with `career-agent rescore` -- which makes zero
#   network calls and zero inference calls of any kind.
# =====================================================================

schema_version: 1
config_version: 2
config_id: personal-alpha
label: "Business Systems / Automation / Integration -- Brazil-based, remote"

# ---------------------------------------------------------------------
# 1. MATCHING TEXT NORMALISATION
#
# How text is folded before patterns are compared. Evidence quotes are
# always cut from the ORIGINAL text, never from the folded copy, so a
# stored quote remains a verifiable substring of the posting (ADR-0002).
# ---------------------------------------------------------------------
normalisation:
  casefold: true
  # "Integracao" matches "integração". Portuguese postings are first-class.
  strip_accents: true
  collapse_whitespace: true
  # A pattern only matches at token boundaries, so "ops" never fires
  # inside "operations".
  word_boundary: true

# Negation cues. When a cue appears inside the guard window immediately
# before a match, the hit is recorded as NEGATED and its effect is
# suppressed. "no cold calling required" is not "cold calling required".
negation:
  window_chars: 40
  cues_en: ["no", "not", "never", "without", "free of", "zero", "rather than", "instead of"]
  cues_pt: ["nao", "sem", "nenhum", "nenhuma", "jamais", "ao inves de"]

# ---------------------------------------------------------------------
# 2. TARGET ROLE TAXONOMY
#
# A title rule is NOT an exact string. It is a set of token groups:
# every group in `all_of` must match somewhere in the title, in any
# order. Each group is a list of alternatives (EN and PT-BR).
#
# That single mechanism gives word-order tolerance, punctuation
# tolerance, singular/plural tolerance and bilingual aliasing without
# a combinatorial list of literal titles -- which is what
# `docs/product/principles.md` section 1 forbids depending on.
#
# `none_of` guards a rule against a title that merely contains its
# words: "Engineering Manager, Automation" should not read as an IC
# automation role.
#
# `$NAME` expands to the fragment list of that name.
# ---------------------------------------------------------------------
taxonomy:

  # -- Vocabulary fragments reused across many title rules ------------
  fragments:
    ENGINEER:    ["engineer", "engineering", "engenheiro", "engenheira", "engenharia"]
    ANALYST:     ["analyst", "analista"]
    SPECIALIST:  ["specialist", "especialista", "expert"]
    CONSULTANT:  ["consultant", "consultor", "consultora", "consultoria"]
    DEVELOPER:   ["developer", "desenvolvedor", "desenvolvedora"]
    ADMIN:       ["administrator", "admin", "administrador", "administradora"]
    ARCHITECT:   ["architect", "arquiteto", "arquiteta"]
    OPS:         ["operations", "operacoes", "ops"]
    LEAD:        ["lead", "leader", "lider", "head"]
    SYSTEMS:     ["systems", "system", "sistemas", "sistema"]
    BUSINESS:    ["business", "negocios", "negocio", "corporativo", "corporativos"]
    AUTOMATION:  ["automation", "automacao", "automations"]
    INTEGRATION: ["integration", "integrations", "integracao", "integracoes"]
    AI:          ["ai", "artificial intelligence", "inteligencia artificial", "genai", "llm"]
    GTM:         ["gtm", "go to market", "go-to-market"]
    REVENUE:     ["revenue", "revops", "receita"]
    CRM:         ["crm"]
    HUBSPOT:     ["hubspot", "hub spot"]
    SOLUTIONS:   ["solutions", "solution", "solucoes", "solucao"]
    FORWARD:     ["forward deployed", "forward-deployed"]
    IMPLEMENT:   ["implementation", "implementacao", "implementer", "implantacao"]
    MARTECH:     ["marketing technology", "martech", "marketing ops", "marketing operations"]
    WORKFLOW:    ["workflow", "workflows", "fluxo de trabalho", "processo", "process"]
    DATA:        ["data", "dados"]
    TECHNICAL:   ["technical", "tecnico", "tecnica"]
    APPLIED:     ["applied", "aplicada", "aplicado"]
    SHARED_SVC:  ["shared services", "shared service", "servicos compartilhados"]
    SOFTWARE:    ["software"]
    MANAGER:     ["manager", "gerente", "gestor", "gestora"]
    DIRECTOR:    ["director", "diretor", "diretora", "vp", "vice president", "chief"]

  # -----------------------------------------------------------------
  # PRIMARY -- the work this profile is built for.
  #
  # A primary title ADMITS a posting and NAMES the role. It is worth ZERO
  # compatibility points, in either direction, and that is ADR-0014 rather
  # than an oversight: this block used to say a primary title was "strong
  # evidence on its own", and the measurement that retired the claim found
  # a warehouse posting scoring 39 as `Business Systems Analyst` and 14 as
  # `Operations Wizard` on the identical body.
  #
  # What a title may still do: name the role, admit it into the search,
  # give the taxonomy something to group by, and carry an explicit
  # SENIORITY, which is evidence about the job rather than about its name.
  # `tests/integration/test_title_is_inert.py` holds both halves.
  # -----------------------------------------------------------------
  primary:
    - id: business_systems
      label: "Business Systems Engineer / Analyst"
      all_of: [["$BUSINESS"], ["$SYSTEMS"], ["$ENGINEER", "$ANALYST", "$SPECIALIST", "$LEAD"]]
      none_of: ["$MANAGER", "$DIRECTOR"]

    - id: automation_engineer
      label: "Automation / Workflow Automation Engineer"
      all_of: [["$AUTOMATION"], ["$ENGINEER", "$SPECIALIST", "$ANALYST", "$DEVELOPER", "$LEAD"]]
      none_of: ["test automation", "qa automation", "automacao de testes", "industrial", "plc", "robotics"]

    - id: integration_engineer
      label: "Integration Engineer / Specialist / Integrations Developer"
      all_of: [["$INTEGRATION"], ["$ENGINEER", "$SPECIALIST", "$ANALYST", "$DEVELOPER", "$LEAD"]]
      # `Integrations Developer` is deliberately IN, not excluded by the
      # word "Developer". Whether it is genuinely integration work is
      # settled by the description, not by the noun in the title.

    - id: ai_automation_engineer
      label: "AI Automation Engineer / AI Implementer"
      all_of: [["$AI"], ["$AUTOMATION", "$WORKFLOW", "$IMPLEMENT", "$INTEGRATION"]]

    - id: enterprise_ai_workflow
      label: "Enterprise AI Workflow Expert"
      all_of: [["$AI"], ["$WORKFLOW"], ["$SPECIALIST", "$ENGINEER", "$LEAD", "enterprise"]]

    - id: gtm_systems
      label: "GTM Systems Engineer"
      all_of: [["$GTM"], ["$SYSTEMS", "$AUTOMATION", "$OPS"]]

    - id: gtm_engineer
      label: "GTM Engineer / Founding GTM Engineer"
      all_of: [["$GTM"], ["$ENGINEER"]]
      # Ambiguous by design. See `ambiguous_titles.gtm_engineer` below:
      # the title opens the door, the description decides.
      ambiguity_rule: gtm_engineer

    - id: revenue_systems
      label: "Revenue / RevOps Systems Engineer"
      all_of: [["$REVENUE"], ["$SYSTEMS", "$OPS", "$AUTOMATION"]]
      none_of: ["$MANAGER", "$DIRECTOR", "quota"]

    - id: crm_systems
      label: "CRM Systems Engineer / CRM Operations"
      all_of: [["$CRM"], ["$SYSTEMS", "$OPS", "$ENGINEER", "$ARCHITECT", "$SPECIALIST"]]

    - id: hubspot_role
      label: "HubSpot Specialist / Consultant / Administrator"
      all_of: [["$HUBSPOT"]]
      ambiguity_rule: hubspot_role

    - id: marketing_technology
      label: "Marketing Technology Specialist"
      all_of: [["$MARTECH"]]
      ambiguity_rule: marketing_technology

    - id: data_and_operations
      label: "Data & Operations Specialist"
      all_of: [["$DATA"], ["$OPS"], ["$SPECIALIST", "$ANALYST", "$ENGINEER"]]

    - id: sales_ops_ai_analyst
      label: "Sales Ops / AI Analyst"
      all_of: [["sales ops", "sales operations", "operacoes de vendas"], ["$ANALYST", "$AI", "$SYSTEMS", "$AUTOMATION"]]
      ambiguity_rule: sales_ops_analyst

    - id: automation_stream_lead
      label: "Automation Stream Lead"
      all_of: [["$AUTOMATION", "$INTEGRATION"], ["$LEAD", "stream lead", "tech lead"]]
      ambiguity_rule: automation_stream_lead

  # -----------------------------------------------------------------
  # STRONG ADJACENT -- not the exact target, but the same work under a
  # different name. Scored just below primary.
  # -----------------------------------------------------------------
  strong_adjacent:
    - id: forward_deployed
      label: "Forward Deployed (AI) Engineer"
      all_of: [["$FORWARD"], ["$ENGINEER", "$SPECIALIST", "$SOLUTIONS"]]
      ambiguity_rule: forward_deployed

    - id: applied_ai_engineer
      label: "Applied AI Engineer / AI Solutions Engineer"
      all_of: [["$AI"], ["$APPLIED", "$SOLUTIONS"], ["$ENGINEER"]]
      ambiguity_rule: applied_ai_engineer

    - id: business_applications
      label: "Business Applications"
      all_of: [["$BUSINESS"], ["applications", "aplicacoes", "apps"]]

    - id: technical_operations
      label: "Technical Operations"
      all_of: [["$TECHNICAL"], ["$OPS"]]
      none_of: ["$MANAGER", "$DIRECTOR", "network", "datacenter", "infrastructure"]

    - id: revops_analyst
      label: "Revenue / Sales Operations Analyst"
      all_of: [["$REVENUE", "sales operations", "operacoes de vendas"], ["$ANALYST", "$SPECIALIST"]]
      ambiguity_rule: sales_ops_analyst

  # -----------------------------------------------------------------
  # CONDITIONAL -- the title alone proves nothing. These pass ONLY when
  # the description carries enough supporting evidence.
  # -----------------------------------------------------------------
  conditional:
    - id: solutions_engineer
      label: "Solutions Engineer / Consultant"
      all_of: [["$SOLUTIONS"], ["$ENGINEER", "$SPECIALIST", "$CONSULTANT", "$ARCHITECT"]]
      ambiguity_rule: solutions_engineer

    - id: implementation_consultant
      label: "Implementation Consultant"
      all_of: [["$IMPLEMENT"], ["$SPECIALIST", "$ENGINEER", "$ANALYST", "$CONSULTANT"]]

    - id: software_engineer_shared_services
      label: "Software Engineer -- Shared Services"
      all_of: [["$SOFTWARE"], ["$ENGINEER"], ["$SHARED_SVC"]]
      ambiguity_rule: software_engineer_shared_services

    - id: software_engineer_integrations
      label: "Software Engineer -- Integrations"
      all_of: [["$SOFTWARE"], ["$ENGINEER"], ["$INTEGRATION"]]
      ambiguity_rule: software_engineer_integrations

  # -----------------------------------------------------------------
  # EXCLUDED -- off-target roles.
  #
  # A title exclusion is not an eligibility blocker: eligibility is about
  # whether the candidate CAN take the job, not whether she wants it
  # (ADR-0004). The job stays visible and explainable rather than
  # silently vanishing.
  #
  # It COSTS NOTHING. This block used to say an excluded title "zeroes the
  # role-family component and applies the configured penalty"; there is no
  # role-family component -- it was removed by ADR-0014 -- and no penalty
  # fires. An excluded title NAMES work that is off-target, and the
  # narrowing that acts on it is `include_off_target`, a view decision the
  # person can undo, rather than points subtracted from a score.
  # -----------------------------------------------------------------
  excluded:
    - id: account_executive
      label: "Account Executive / quota-carrying sales"
      all_of: [["account executive", "executivo de contas", "sales representative", "representante de vendas", "sales development representative", "business development representative"]]

    - id: sales_manager
      label: "Sales management"
      all_of: [["sales", "vendas"], ["$MANAGER", "$DIRECTOR"]]
      none_of: ["$SYSTEMS", "$OPS", "$AUTOMATION", "$ENGINEER"]

    - id: salesforce_specialist
      label: "Salesforce-centred specialist role"
      all_of: [["salesforce", "sfdc", "apex", "visualforce"], ["$DEVELOPER", "$ADMIN", "$SPECIALIST", "$ENGINEER", "$ARCHITECT", "$CONSULTANT"]]
      # This rule names the role. It no longer PRICES it: a title-only
      # penalty of 15 used to fire here, so `Salesforce Administrator` scored
      # 30 where the identical body under a plain title scored 48. Salesforce
      # as one tool among many still reaches the score through `tool_stack`.

    - id: netsuite_specialist
      label: "NetSuite-centred role"
      all_of: [["netsuite", "suitescript"]]

    - id: coupa_specialist
      label: "Coupa-centred role"
      all_of: [["coupa"]]

    - id: people_manager_first
      label: "People-manager-first role"
      all_of: [["$MANAGER", "$DIRECTOR", "head of"], ["people", "team", "equipe", "pessoas"]]

    - id: pure_backend
      label: "Traditional backend / product software engineering"
      all_of: [["backend", "back-end", "back end", "full stack", "fullstack", "frontend", "front-end", "mobile", "ios", "android"], ["$ENGINEER", "$DEVELOPER"]]
      none_of: ["$INTEGRATION", "$AUTOMATION", "$BUSINESS", "$SYSTEMS", "$SHARED_SVC", "$CRM", "$GTM"]

    - id: presales_engineer
      label: "Pre-sales / sales engineering"
      all_of: [["pre sales", "presales", "pre-sales", "sales engineer", "engenheiro de vendas"]]

# ---------------------------------------------------------------------
# 3. AMBIGUOUS-TITLE INTERPRETATION RULES
#
# A title that could mean two jobs. Each rule names the description
# signals that resolve it. `promote_to` moves the title UP a class;
# `demote_to` moves it DOWN. Both are evaluated over signals that were
# actually found, with their measured prominence -- so a single passing
# mention never flips a classification.
#
# Demotion is evaluated first: a strong off-target signal wins over a
# weak on-target one.
#
# `min_prominence` values: PRIMARY (title or a responsibilities
# heading), SECONDARY (repeated in the body or under requirements),
# INCIDENTAL (one mention).
# ---------------------------------------------------------------------
ambiguous_titles:

  gtm_engineer:
    note: "GTM Engineer is systems work at some companies and outbound sales at others."
    promote_to: primary
    promote_if:
      any_of: [gtm_systems_work, crm_architecture, lead_routing, data_enrichment,
               workflow_automation, api_integration, internal_tooling, revops_infrastructure,
               applied_ai_workflow, data_quality]
      min_signals: 2
      min_prominence: SECONDARY
    demote_to: excluded
    demote_if:
      any_of: [quota_carrying_sales, cold_outbound, account_executive_work, sales_development]
      min_signals: 1
      min_prominence: PRIMARY

  forward_deployed:
    note: "Forward Deployed Engineer spans implementation consulting and deep backend work."
    promote_to: primary
    promote_if:
      any_of: [customer_implementation, solution_configuration, api_integration,
               workflow_automation, requirements_translation, applied_ai_workflow,
               technical_enablement]
      min_signals: 2
      min_prominence: SECONDARY
    demote_to: excluded
    demote_if:
      any_of: [heavy_engineering, algorithmic_depth, frequent_travel, onsite_required]
      min_signals: 1
      min_prominence: SECONDARY

  applied_ai_engineer:
    promote_to: primary
    promote_if:
      any_of: [workflow_automation, api_integration, business_process_design, applied_ai_workflow]
      min_signals: 2
      min_prominence: SECONDARY
    demote_to: excluded
    demote_if:
      any_of: [ml_research, model_training, heavy_engineering]
      min_signals: 1
      min_prominence: PRIMARY

  hubspot_role:
    promote_to: primary
    promote_if:
      any_of: [hubspot_platform, crm_architecture, api_integration, workflow_automation,
               custom_objects, private_apps, data_modeling, governance]
      min_signals: 1
      min_prominence: SECONDARY
    demote_to: excluded
    demote_if:
      # INCIDENTAL: "sell HubSpot" and "grow our agency" have exactly one
      # meaning. One occurrence settles what the role is.
      any_of: [selling_hubspot, agency_account_management, cold_outbound, campaign_execution_only]
      min_signals: 1
      min_prominence: INCIDENTAL

  marketing_technology:
    promote_to: primary
    promote_if:
      any_of: [hubspot_platform, crm_architecture, lifecycle_workflow, api_integration,
               lead_routing, workflow_automation]
      min_signals: 1
      min_prominence: SECONDARY
    demote_to: conditional
    demote_if:
      any_of: [campaign_execution_only, content_production]
      min_signals: 1
      min_prominence: PRIMARY

  automation_stream_lead:
    note: "'Lead' is a workstream, not automatically a headcount."
    promote_to: primary
    promote_if:
      any_of: [workflow_automation, api_integration, system_integration, internal_tooling]
      min_signals: 2
      min_prominence: SECONDARY
    demote_to: excluded
    demote_if:
      any_of: [people_management]
      min_signals: 1
      min_prominence: PRIMARY

  sales_ops_analyst:
    promote_to: primary
    promote_if:
      any_of: [crm_architecture, workflow_automation, data_quality, operational_analytics,
               api_integration, applied_ai_workflow, business_process_design]
      min_signals: 2
      min_prominence: SECONDARY
    demote_to: excluded
    demote_if:
      any_of: [quota_carrying_sales, manual_reporting_only, quota_administration]
      min_signals: 1
      min_prominence: PRIMARY

  solutions_engineer:
    promote_to: strong_adjacent
    promote_if:
      any_of: [customer_implementation, api_integration, workflow_automation, solution_configuration]
      min_signals: 2
      min_prominence: SECONDARY
    demote_to: excluded
    demote_if:
      any_of: [presales_demo, rfp_ownership, quota_carrying_sales]
      min_signals: 1
      min_prominence: PRIMARY

  software_engineer_shared_services:
    note: "Passes only when 'shared services' means internal business platforms."
    promote_to: strong_adjacent
    promote_if:
      any_of: [internal_tooling, system_integration, business_systems_platform,
               api_integration, workflow_automation, crm_architecture]
      min_signals: 2
      min_prominence: SECONDARY
    demote_to: excluded
    demote_if:
      any_of: [heavy_engineering, algorithmic_depth, product_development]
      min_signals: 1
      min_prominence: SECONDARY

  software_engineer_integrations:
    promote_to: strong_adjacent
    promote_if:
      any_of: [api_integration, system_integration, ipaas, data_sync, crm_architecture]
      min_signals: 2
      min_prominence: SECONDARY
    demote_to: excluded
    demote_if:
      any_of: [heavy_engineering, product_development]
      min_signals: 1
      min_prominence: PRIMARY

# ---------------------------------------------------------------------
# 4. LEXICON
#
# Every named signal the matcher can observe. A signal is a list of
# literal phrases; the matcher records WHERE each one was found, the
# exact quote, and whether it was negated.
#
# `responsibility` binds the signal to the shared vocabulary in
# `career_agent.domain.enums.ResponsibilityCategory` so the deterministic
# matcher and a future LLM observation speak the same language.
# ---------------------------------------------------------------------
lexicon:

  # -- Positive: the work itself -------------------------------------
  workflow_automation:
    label: "Workflow / business-process automation"
    responsibility: workflow_automation
    patterns: ["workflow automation", "business process automation", "process automation",
               "automate workflows", "automating workflows", "automate processes",
               "automation workflows", "no code automation", "low code automation",
               "automacao de processos", "automacao de fluxos", "automatizar processos"]

  api_integration:
    label: "REST APIs, webhooks, integration engineering"
    responsibility: api_integration
    patterns: ["rest api", "restful api", "api integration", "webhook", "webhooks",
               "graphql", "oauth", "api endpoints", "public api", "json payload",
               "integracao de api", "integracao via api", "apis"]

  system_integration:
    label: "System-to-system integration"
    responsibility: system_integration
    patterns: ["system integration", "systems integration", "integrate systems",
               "connect systems", "integration platform", "middleware",
               "integracao de sistemas", "integrar sistemas"]

  ipaas:
    label: "iPaaS / orchestration tooling"
    responsibility: workflow_automation
    patterns: ["ipaas", "n8n", "workato", "zapier", "make.com", "integromat", "tray.io",
               "mulesoft", "boomi", "celigo", "pipedream", "power automate", "pipefy"]

  data_sync:
    label: "Data synchronisation and migration"
    responsibility: data_sync_and_migration
    patterns: ["data sync", "data synchronization", "data synchronisation", "data migration",
               "etl", "reverse etl", "sincronizacao de dados", "migracao de dados"]

  crm_architecture:
    label: "CRM architecture and data model"
    responsibility: crm_architecture
    patterns: ["crm architecture", "crm data model", "crm administration", "crm operations",
               "crm system", "crm platform", "object model",
               "arquitetura de crm", "modelo de dados"]

  hubspot_platform:
    label: "HubSpot platform ownership"
    responsibility: crm_architecture
    patterns: ["hubspot", "operations hub", "marketing hub", "sales hub", "service hub",
               "hubspot api", "hubspot workflows", "hubspot crm"]

  custom_objects:
    label: "Custom objects / schema extension"
    responsibility: data_modeling_for_business_systems
    patterns: ["custom object", "custom objects", "custom properties", "schema extension"]

  private_apps:
    label: "Private apps / platform extensions"
    responsibility: internal_tooling
    patterns: ["private app", "private apps", "custom app", "serverless function",
               "ui extension", "app marketplace"]

  gtm_systems_work:
    label: "GTM / revenue systems"
    responsibility: gtm_systems_ownership
    patterns: ["gtm systems", "go to market systems", "revenue systems", "revops",
               "revenue operations", "sales systems", "gtm stack", "revenue stack",
               "gtm infrastructure", "lifecycle systems"]

  revops_infrastructure:
    label: "RevOps infrastructure"
    responsibility: gtm_systems_ownership
    patterns: ["revops infrastructure", "revenue infrastructure", "gtm engineering",
               "revenue engineering"]

  lead_routing:
    label: "Lead routing and assignment"
    responsibility: workflow_automation
    patterns: ["lead routing", "lead assignment", "round robin", "territory assignment",
               "lead scoring", "roteamento de leads"]

  data_enrichment:
    label: "Data enrichment"
    responsibility: data_quality_management
    patterns: ["data enrichment", "enrichment", "clearbit", "apollo.io", "zoominfo",
               "enriquecimento de dados"]

  data_quality:
    label: "Data quality management"
    responsibility: data_quality_management
    patterns: ["data quality", "data hygiene", "deduplication", "data governance",
               "qualidade de dados", "governanca de dados"]

  internal_tooling:
    label: "Internal tooling"
    responsibility: internal_tooling
    patterns: ["internal tools", "internal tooling", "internal platform", "internal systems",
               "operational tooling", "ferramentas internas"]

  business_systems_platform:
    label: "Business systems platform ownership"
    responsibility: business_systems_administration
    patterns: ["business systems", "business applications", "enterprise applications",
               "enterprise systems", "back office systems", "internal business systems",
               "sistemas de negocio", "sistemas corporativos"]

  applied_ai_workflow:
    label: "Applied AI / AI agents in business workflows"
    responsibility: workflow_automation
    patterns: ["ai agent", "ai agents", "ai workflow", "ai workflows", "llm",
               "large language model", "generative ai", "genai", "ai automation",
               "prompt engineering", "rag", "retrieval augmented",
               "agentes de ia", "inteligencia artificial aplicada"]

  business_process_design:
    label: "Business process design"
    responsibility: business_process_design
    patterns: ["process design", "process improvement", "process mapping",
               "business process", "operational process", "desenho de processos",
               "melhoria de processos", "mapeamento de processos"]

  requirements_translation:
    label: "Requirements gathering and translation"
    responsibility: requirements_gathering
    patterns: ["gather requirements", "gathering requirements", "requirements gathering",
               "business requirements", "translate business", "stakeholder requirements",
               "levantamento de requisitos", "requisitos de negocio"]

  operational_analytics:
    label: "Reporting and operational analytics"
    responsibility: reporting_and_dashboards
    patterns: ["dashboards", "reporting", "operational analytics", "business intelligence",
               "looker", "tableau", "power bi", "metabase", "relatorios", "painel"]

  data_modeling:
    label: "Operational data modelling"
