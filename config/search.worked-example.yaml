    patterns: ["technical enablement", "enablement", "train users", "user training",
               "change management", "capacitacao", "treinamento"]

  governance:
    label: "Systems governance"
    responsibility: user_access_and_permissions
    patterns: ["governance", "permissions", "user access", "access control",
               "role based access", "governanca", "permissoes"]

  lifecycle_workflow:
    label: "Lifecycle / marketing automation workflows"
    responsibility: workflow_automation
    patterns: ["lifecycle marketing", "lifecycle stage", "marketing automation",
               "nurture", "drip campaign", "customer lifecycle", "ciclo de vida"]

  scripting:
    label: "Scripting and data transformation"
    responsibility: scripting_and_data_transformation
