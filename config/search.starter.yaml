# =====================================================================
# The neutral starting point.
#
# GENERATED by `scripts/make_starter_config.py` from `search.worked-example.yaml`.
# Do not edit this file by hand: edit the generator, or edit YOUR OWN
# `search.local.yaml`, which is what `career-agent setup` writes and what
# overrides everything here.
#
# It is the same machine as the example with the person taken out. Every
# scoring component, every prominence multiplier, every negation window and
# every threshold survives; the phrases, the titles, the country, the target
# regions and the preferences are empty, because those are yours.
#
# A search with an empty lexicon scores every posting at zero on the phrase
# components, which is correct rather than broken: nothing has been said yet
# about what you are looking for. `career-agent setup` is how you say it.
#
# NOTHING HERE NAMES AN OCCUPATION, and that is a rule rather than a tidy-up.
# A lawyer, a student, a nurse, a salesperson and an engineer get this same
# file. Every occupational preference belongs in your own answers.
#
# `sources.enabled` is empty and inert. Which job boards Career Agent can
# actually read is recorded in `config/source_catalogue.yaml`, measured per
# provider, and it is not a preference.
# =====================================================================

schema_version: 1
config_version: 1
config_id: my-search
label: My job search
normalisation:
  casefold: true
  strip_accents: true
  collapse_whitespace: true
  word_boundary: true
negation:
  window_chars: 40
  cues_en:
  - 'no'
  - not
  - never
  - without
  - free of
  - zero
  - rather than
  - instead of
  cues_pt:
  - nao
  - sem
  - nenhum
  - nenhuma
  - jamais
  - ao inves de
taxonomy:
  fragments: {}
  primary: []
  strong_adjacent: []
  conditional: []
  excluded: []
ambiguous_titles: {}
lexicon: {}
prominence:
  primary_fields:
  - title
  primary_headings:
  - responsibilities
  - what you'll do
  - what you will do
  - the role
  - your impact
  - day to day
  - about the role
  - responsabilidades
  - o que voce vai fazer
  - sobre a vaga
  - atividades
  - suas atividades
  secondary_min_hits: 2
  secondary_headings:
  - requirements
  - qualifications
  - what we're looking for
  - must have
  - you have
  - skills
  - requisitos
  - qualificacoes
  - o que buscamos
  - pre-requisitos
  - habilidades
screening:
  required_any_groups: []
  required_all: []
eligibility:
  candidate_country: ''
  candidate_country_label: ''
  blockers: []
  eligible_scopes: []
  eligible_countries: []
  positive_scope_patterns: {}
scoring:
  components:
    responsibilities:
      max: 25
      label: The work itself, in your words
      prominence_multipliers:
        PRIMARY: 1.0
        SECONDARY: 0.7
        INCIDENTAL: 0.35
      weights: {}
    technologies:
      max: 20
      label: Tools and systems you named
      prominence_multipliers:
        PRIMARY: 1.0
        SECONDARY: 0.8
        INCIDENTAL: 0.5
      weights: {}
    automation_integration:
      max: 15
      label: Other phrases you said matter
      prominence_multipliers:
        PRIMARY: 1.0
        SECONDARY: 0.8
        INCIDENTAL: 0.5
      weights: {}
    seniority:
      max: 10
      label: Seniority alignment
      points:
        INTERN: 0
        JUNIOR: 3
        MID: 9
        SENIOR: 10
        STAFF: 4
        PRINCIPAL: 2
        LEAD: 8
      unevidenced: 0
    compensation_contract:
      max: 5
      label: Compensation and contract preference
      salary_meets_target: 3
      salary_below_target: 0
      salary_unknown: 2
      contract_preferred: 2
      contract_unknown: 1
      contract_unwanted: 0
  soft_penalties:
    prominence_multipliers:
      PRIMARY: 1.0
      SECONDARY: 0.6
      INCIDENTAL: 0.2
    weights: {}
confidence:
  components:
    description_present:
      points: 25
      label: Full description text available
    description_substantial:
      points: 15
      min_chars: 1200
      label: Description is substantial
    location_stated:
      points: 12
      label: Location stated
    hiring_scope_explicit:
      points: 13
      label: Hiring scope explicitly stated
    employment_type_known:
      points: 10
      label: Employment type known
    salary_known:
      points: 10
      label: Compensation stated
    seniority_determinable:
      points: 8
      label: Seniority determinable from the body
    posted_date_known:
      points: 7
      label: Posting date known
preferences:
  remote:
    accepted_work_models: []
    require_remote: false
  contract:
    preferred: []
    unwanted: []
  seniority:
    preferred: []
  travel:
    max_tolerated_pct: 15
  compensation:
    target_monthly_amount: 0
    currency: USD
    period: MONTH
    conversion_rates: {}
    conversion_rates_dated: null
  recency:
    fresh_days: 14
    stale_days: 45
thresholds:
  shortlist_min_score: 55
  local_ai_min_score: 60
  display_min_score: 0
  fit_bands:
    STRONG: 75
    GOOD: 55
    MODERATE: 35
  confidence_bands:
    HIGH: 70
    MEDIUM: 45
sources:
  priority:
  - ats_structured
  - official_api
  - official_mcp
  - rss
  - public_html
  - manual_import
  enabled: {}
regions:
  target: []
  opportunistic: []
