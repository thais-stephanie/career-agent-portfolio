# =====================================================================
# ENGINEERING SEED BOARDS - NOT A TARGET COMPANY LIST
#   M1A: Greenhouse (11)   M1B: Lever (8)   M1C: Ashby (10)
#
# These companies were chosen to exercise the collectors against
# real-world variation: different board sizes, description formats, HTML
# styles, location strings and field completeness.
#
# They are NOT the candidate's target companies, and their presence here
# implies nothing about career fit. M1D builds the real curated registry,
# prioritising international / remote-friendly SaaS and technology companies,
# target company markets, dream companies and corpus feedback.
#
# How the Greenhouse boards were identified: probed the public Greenhouse job
# board API (GET /v1/boards/{token}/jobs) for a list of candidate tokens derived
# from well-known technology companies, and kept those returning HTTP 200
# with a non-empty jobs array on 2026-08-25.
#
# How the Lever boards were identified: the same method against
# GET https://api.lever.co/v0/postings/{site}?mode=json, over 185 candidate
# slugs on 2026-08-25. Nine boards came back non-empty (2174 postings) and six
# came back valid-but-empty.
#
# Selection favoured spread over volume, at both providers.
#
# Greenhouse: 11 boards ranging from 11 to 81 postings, across
# US / UK / DE / ES / global and across SaaS, fintech, developer tools, open
# source and non-profit. Very large boards (stripe 590, sumup 391,
# cloudflare 310) were deliberately left out: they add request load without
# adding payload variety.
#
# Lever: 8 boards, chosen for the ways they are *awkward* rather than for size.
# Two of them publish no department, one publishes no list sections at all, one
# discloses salary on every posting, and one is deliberately empty. veeva (877)
# and gopuff (815) were left out for the same reason stripe was.
#
# Ashby: 10 boards, same principle. Probed 79 slugs against
# GET https://api.ashbyhq.com/posting-api/job-board/{board}?includeCompensation=true
# on 2026-08-26; 42 came back with postings (3105 total) and 5 valid-but-empty.
# The chosen ten span 0 to 246 postings and cover the extremes measured: one
# board where workplaceType is null on 100% of postings, one where compensation
# is on 100%, one on 0%, one that is 82% onsite, one with 24 countries, one
# where 76% of postings carry secondary locations, and one that is empty.
# openai (751) and harvey (361) were left out: request load without variety.
# =====================================================================

schema_version: 1
purpose: engineering_validation_only

