  # Deliberately empty. Returns HTTP 200 with `[]`, which is the case the
  # closing logic must treat as "the board answered and has no openings"
  # rather than as a failure. Keeping it in the seed set makes that a
  # permanent live test instead of a one-off check.
  - slug: kraken
    name: Kraken
    hq_country: US
    notes: "Lever, 0 postings. Valid empty board - exercises empty-vs-failure."
    boards:
      - { provider: lever, board_identifier: kraken }

