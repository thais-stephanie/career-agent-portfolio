# =====================================================================
# The sanitised demo corpus.
#
# Nineteen invented postings at seventeen invented companies. Nothing
# here came from a real job board, no real employer is named, and every
# URL uses the reserved `.invalid` TLD so nothing can accidentally
# resolve.
#
# Nineteen postings, seventeen ROLES: demo-001, demo-018 and demo-019 are
# one role published once per regional board, which is how an employer
# actually produces duplicates. Cards collapses them to one card; Table
# shows all three. Both numbers are true, of different questions.
#
# It exists for three jobs at once, and the overlap is deliberate:
#
#   1. A DEMO. `career-agent seed-demo` builds a working database from
#      this file in about a second, so the product can be opened,
#      screenshotted and shown to somebody without exposing a single
#      real posting or the candidate's own corpus (`data/` is
#      gitignored and stays that way -- ADR-0006).
#
#   2. The BEHAVIOURAL PROOFS. Each posting carries an `expects` block
#      naming what the matcher must conclude about it.
#      `tests/integration/test_demo_acceptance.py` reads this file and
#      asserts every one. When a lexicon change breaks a judgement, a
#      named test fails and says which posting and which judgement.
#
#   3. BROWSER ACCEPTANCE. The UI tests drive this same database, so
#      what a reviewer sees on screen is what the unit tests assert.
#
# THE DEMO CORPUS DEMONSTRATES WHAT CAREER AGENT CAN KNOW FROM A SOURCE,
# NOT WHAT A FIXTURE AUTHOR WISHES IT KNEW.
#
# That is the invariant, and it is enforced by
# `tests/integration/test_demo_is_reconstructible.py`: a posting's derived
# facts must be reconstructible solely from the raw payload and metadata that
# would exist for the provider it imitates. Seed a database, force a rescore,
# and every semantically meaningful column is unchanged.
#
# It was false until V1.4, invisibly. Each posting carried `employment_type:`
# and a `salary:` block that the seeder handed straight to the matcher as
# keyword arguments, while `rescore` -- the only path the real corpus ever
# takes -- can read those only out of an archived provider payload through
# that provider's own reader. Pressing Recalculate moved 18 of these 19
# scores.
#
# So each posting names the provider it imitates and carries a `payload:`
# shaped like that provider's real API response, and `pipeline/facts.py`
# derives the facts for the seeder, for a rescore and for the acceptance
# harness alike. Three providers, chosen by what each posting has to show:
#
#   ashby       a salary WITH a period, and an employment type. Its adapter
#               maps `employmentType` and reads `compensation
#               .compensationTiers`, whose `interval` is where a period can
#               honestly come from.
#   lever       an employment type and no salary, through
#               `categories.commitment`.
#   greenhouse  neither. Its field map has ONE mapping, `location.name`, and
#               `read_compensation` documents that the period is None,
#               always. `demo-012` therefore has no employment type -- and
#               still reads CLT, because `match/employment.py` finds
#               "Contratacao CLT" in the body and quotes it. That is the
#               distinction the rule makes visible.
#
# `demo-017` has no payload at all, which is also a real state: a posting
# collected before its metadata arrived.
#
# The postings are written to be *hard* on purpose. Several pairs differ
# only in the body -- same shape of title, opposite correct answer --
# because a matcher that reads titles would pass a corpus of easy cases
# and fail every one of these. The duplicate trio is hard the other way
# round: same work, deliberately different prose, so nothing can group it
# by `content_hash` and get the right answer by accident.
# =====================================================================

schema_version: 1
purpose: sanitized_demo
generated_for: personal-alpha

# Which ATS the demo postings imitate. It lives here, in DATA, and not in
# `pipeline/demo_seed.py`, because `tests/unit/test_provider_neutrality.py`
# forbids generic code from naming a vendor -- and it is right to. The demo
# needs "a structured ATS" so the provenance column shows something real;
# which one is a property of this corpus, not of the seeding code.
imitates_provider: greenhouse

postings:

  # -- The straightforward strong match --------------------------------
  - external_id: demo-001
    company: {slug: northwind-systems, name: "Northwind Systems", hq_country: US}
    title: "Business Systems Engineer"
    location_raw: "Remote, worldwide"
    department: "Business Technology"
    posted_at: "2026-08-30"
    imitates_provider: ashby
    payload:
      employmentType: FullTime
      workplaceType: Remote
      location: "Remote, worldwide"
      compensation:
        compensationTiers:
          - components:
              - compensationType: Salary
                currencyCode: USD
                interval: "1 YEAR"
                minValue: "95000.0"
                maxValue: "125000.0"
    url: "https://northwind.example.invalid/jobs/demo-001"
    description: |
      Northwind Systems is hiring a Business Systems Engineer to own the
      internal platforms our go-to-market and finance teams run on.

      Responsibilities
      - Own our HubSpot CRM architecture: the object model, custom objects,
        custom properties and the lifecycle stage definitions everything else
        depends on.
      - Design and build workflow automation across HubSpot, Stripe and our
        billing system, using n8n for orchestration and private apps where a
        workflow is not enough.
      - Build and maintain REST API integrations and webhooks between our
        business systems, and own the data synchronization that keeps them
        consistent.
      - Improve data quality: deduplication, validation rules, and the
        monitoring that tells us when a sync has drifted.
      - Gather business requirements from revenue operations and finance, then
        translate them into systems that hold up.
      - Write the documentation and runbooks that make this maintainable by
        someone other than you.

      Requirements
      - 5+ years in business systems, revenue operations or systems integration.
      - Deep HubSpot experience, including the HubSpot API.
      - Comfortable with JSON, SQL and light scripting in Python or JavaScript.
      - Experience with an iPaaS such as n8n, Workato, Zapier or Make.

      We hire globally and work from anywhere. This is a fully remote worldwide
      role and we support contractors through an employer of record.
    expects:
      title_class: PRIMARY
      eligibility_status: VERIFIED_ELIGIBLE
      screening_state: NOT_BLOCKED
      min_score: 70
      min_confidence: 70
      must_fire: [hubspot_platform, workflow_automation, api_integration, crm_architecture, ipaas]
      no_penalty: [quota_carrying_sales, cold_outbound]

