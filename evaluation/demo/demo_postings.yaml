  # -- PROOF 18a/18b: one role, published once per regional board ---------
  #
  # demo-001, demo-018 and demo-019 are the SAME role at the SAME company:
  # `(company_id, title)` matches, so the interface collapses them to one
  # card carrying "3 locations". They exist because grouping had no reachable
  # demo at all -- seventeen distinct postings meant `duplicate_count` was 1
  # everywhere, and a behaviour with no evidence is one a reviewer has to
  # take on trust.
