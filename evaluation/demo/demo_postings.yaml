    url: "https://fernmoor.example.invalid/jobs/demo-020"
    description: |
      Fernmoor Labs is opening a Junior Business Systems Analyst role, and we
      mean junior: this is an entry-level position, no previous experience is
      required and training is provided.

      We would rather teach somebody the shape of our systems than hire
      somebody who already knows a different company's. Recent graduates are
