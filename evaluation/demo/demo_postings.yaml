  # THE BODIES ARE NOT BYTE-IDENTICAL, AND THAT IS THE POINT. A real employer
  # publishing per region varies the listing line and the local benefit while
  # describing the same work, which is exactly why `content_hash` cannot be
  # the grouping key -- only 8 of 31 surplus rows in the real corpus were
  # byte-identical. `(company_id, title)` can, and is.
