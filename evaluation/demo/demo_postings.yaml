  # -------------------------------------------------------------------
  # TWO POSTINGS FOR THE PEOPLE THE REST OF THIS CORPUS LEFT OUT.
  #
  # Everything above is written for somebody continuing in the work they
  # already do. These two are not, and each one exists because the
  # experience reading added by migration 0027 has no honest example
  # otherwise -- a facet with no counts behind it is not a filter, and a
  # corpus that cannot demonstrate a capability cannot prove it either.
  #
  # demo-020  IN SCOPE for this search and explicitly open to a beginner.
  #           It is the only posting here that states NONE_REQUIRED, and it
  #           is visible in the default view, which is what gives the
  #           "Getting in" controls something to count.
  #
  # demo-021  OUT OF SCOPE for this search by construction, and the case a
  #           career changer actually faces. The search describes systems
  #           work; this is administration. `screening_state: BLOCKED` is
  #           the product working, and the transition control is how
  #           somebody with confirmed evidence for documentation,
  #           scheduling and client communication gets it back.
  # -------------------------------------------------------------------
  - external_id: demo-020
    company: {slug: fernmoor-labs, name: "Fernmoor Labs", hq_country: PT}
    title: "Junior Business Systems Analyst"
    location_raw: "Remote, worldwide"
