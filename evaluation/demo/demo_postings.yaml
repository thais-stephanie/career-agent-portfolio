  # signal differs. So all three score 99, the election falls through to
  # "lowest `j.id`", and because ULIDs are time-sortable that is the posting
  # seeded first, which is the one written first in THIS FILE. demo-001 is
  # therefore the representative, and `test_web_api.py` asserts it by name.
