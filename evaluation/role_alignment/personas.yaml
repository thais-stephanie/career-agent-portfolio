# Role-core alignment benchmark: invented people, invented titles.
#
# Labels are a person's judgment of the ROLE, written before the classifier
# was run and never edited to fit it:
#   ALIGNED   the role they named (any level)
#   ADJACENT  a neighbouring role they could plausibly want or move into
#   OUTSIDE   a different job
#   UNRESOLVED the title names no role
#
# Nine occupations, deliberately not the maintainer's.
personas:
  - name: stylist
    roles: [Hair Stylist]
    work: [hair colouring, haircuts]
    titles:
      Senior Hair Stylist: ALIGNED
      Hairdresser: ALIGNED
      Hair Stylist - Part Time: ALIGNED
      Salon Manager: ADJACENT
      Colorist: ADJACENT
      Barber: ADJACENT
      Nail Technician: OUTSIDE
      Receptionist: OUTSIDE
      Software Engineer: OUTSIDE
      General application: UNRESOLVED
