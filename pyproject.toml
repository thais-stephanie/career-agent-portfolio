[project]
name = "career-agent"
version = "0.2.0b1"
description = "Local job discovery, eligibility and Search Fit, with local profiles and Resume Tailor"
readme = "README.md"
requires-python = ">=3.12"

# --- Runtime dependencies -----------------------------------------------
# httpx + tenacity arrived at M1A. google-genai arrives at M2.6, and only
# because M2 Stage 0 benchmarks the free Gemini arm: it is imported inside
# `GoogleClient.complete`, so nothing loads it unless a live call is actually
# being made. jinja2 at M5.
dependencies = [
    "resume-tailor",
    "pydantic>=2.7",       # validates config and (later) LLM output
    "pyyaml>=6.0",         # reads the .yaml config files
    "typer>=0.12",         # turns Python functions into terminal commands
    "python-dotenv>=1.0",  # reads .env so secrets stay out of the code
    "python-ulid>=2.7",    # time-sortable IDs generated in Python (hazard A1)
    "httpx>=0.28.1",
    "tenacity>=9.1.4",
    "google-genai>=1.0",   # the ONLY vendor SDK; imported only by llm/vendors/google.py
    "openai>=1.0",
    # --- CV text extraction, local only --------------------------------
    # Both are narrow, pure-Python and permissively licensed (pypdf BSD-3,
    # python-docx MIT). Imported INSIDE the reader that needs them, so a
    # person who never imports a CV never loads either -- the same discipline
    # `google-genai` follows.
    #
    # They extract TEXT and nothing else. Neither renders, neither executes
    # embedded content, and `cv/extract.py` is the only module allowed to
    # import them.
    "pypdf>=5.0",
    "python-docx>=1.1",
    # Experimental LinkedIn source only (off by default). python-jobspy pins
    # numpy 1.26.3, which has wheels only up to Python 3.12; on a newer
    # Python the source reports itself unavailable instead of breaking install.
    "python-jobspy>=1.1.82; python_version < '3.13'",
]

[project.scripts]
career-agent = "career_agent.cli:app"

# --- Development-only tools ---------------------------------------------
[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",        # type stubs, so mypy understands yaml.safe_load
    "tiktoken>=0.7",
]

# --- How the package is built and found ---------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/career_agent"]

# --- ruff: formatting and linting ---------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# ruff formats Python code blocks inside Markdown. The architecture documents
# are approved prose whose snippets are aligned for reading, not for execution,
# so the formatter must leave them alone.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors    - spacing, line length
    "F",    # pyflakes              - unused imports, undefined names
    "I",    # isort                 - import ordering
    "UP",   # pyupgrade             - modern Python syntax
    "B",    # flake8-bugbear        - likely bugs (e.g. mutable default args)
    "SIM",  # flake8-simplify       - needlessly complicated constructs
]

# --- mypy: strict where the decisions live ------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "career_agent.domain.*"
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
no_implicit_optional = true
strict_equality = true
warn_unused_ignores = true

# --- pytest -------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.uv.sources]
resume-tailor = { path = "companion/resume-tailor", editable = true }
