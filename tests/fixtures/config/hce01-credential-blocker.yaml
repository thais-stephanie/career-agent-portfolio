# HCE01, the owner's ratified constraint (evaluation/search-fit-owner-intent-v1/
# ratified-v2/OWNER_CONSTRAINTS.md): exclude a posting when the employer
# explicitly REQUIRES a Salesforce certification the candidate does not hold.
#
# This is a FIXTURE and a worked example of the generic credential gate. The
# engine names no credential; the committed starter assumes none of anybody.
# The owner adds this block under `eligibility.blockers` in her private
# `config/search.local.yaml` (gitignored), bumps `config_version`, and runs
# `career-agent rescore` (proportional to the change, ADR-0025). Nothing in
# this repository writes it there.
#
# Phrases are matched folded (case and accents ignored), on word boundaries,
# in the description, the title and a declared hiring-scope field; a hit
# inside the configured negation window ("not required", "no ... required")
# is not a hit because `negation_sensitive` is true. "preferred", "a plus",
# "nice to have", "experience required" and "knowledge required" are not in
# the list on purpose: the owner's DO-NOT-EXCLUDE examples.
blocker:
  id: salesforce_certification_required
  label: Requires a Salesforce certification the candidate does not hold
  gate: credential
  negation_sensitive: true
  patterns:
    - salesforce certification required
    - salesforce certification is required
    - salesforce certification is mandatory
    - salesforce certification mandatory
    - required salesforce certification
    - must be salesforce certified
    - must hold a salesforce certification
    - salesforce administrator certification required
    - salesforce certified administrator required
    - salesforce platform app builder certification required
    - certificacao salesforce obrigatoria
    - certificacao salesforce e obrigatoria
    - certificacao salesforce exigida
    - obrigatorio possuir certificacao salesforce

# The owner's examples, as the acceptance set the tests run.
exclude:
  - Salesforce certification required
  - must be Salesforce certified
  - must hold a Salesforce certification
  - Salesforce certification is mandatory
  - required Salesforce certification
  - Salesforce Administrator certification required
  - Salesforce Certified Administrator required
  - Salesforce Platform App Builder certification required
do_not_exclude:
  - Salesforce certification preferred
  - certification is a plus
  - nice to have
  - Salesforce experience required
  - Salesforce knowledge required
  - Salesforce experience/knowledge without mandatory certification
  - Salesforce certification preferred but not required
  - Salesforce certification is not required
  - Salesforce experience and knowledge, no certification required
