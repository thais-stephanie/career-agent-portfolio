# A balanced synthetic corpus for Matching Architecture v2 (ADR-0037).
#
# Invented sentences, no real posting and no real person. Twelve concepts from
# different professions; each written as a person would write a preference,
# sometimes in English, sometimes in Portuguese. Every case says what a correct
# reader should answer and which category it tests:
#
#   T  translation of the same concept           -> MATCH
#   X  fixed expression translated as a unit     -> MATCH
#   F  inflection or word order, same language   -> MATCH
#   S  a related, broader or narrower concept    -> never MATCH (a design rule)
#   P  the words present in another sense        -> should not MATCH (measured)
#   N  unrelated text                            -> never MATCH
#   C  the concept, but in About us / Benefits   -> never MATCH (context rule)
#
# Unless `heading` says otherwise, a sentence sits under "Responsibilities".
# Spanish (lang: es) only shows the design is not bilingual by construction.
version: 1
