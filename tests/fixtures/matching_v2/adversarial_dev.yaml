# Adversarial corpus, DEVELOPMENT half (ADR-0037, 2026-10-14).
#
# Invented sentences, no real posting and no real person. Written to attack
# the structural reading of `matching_v2.structure`: prepositions that invert
# or keep the head, coordination closed by a complement or shared by a verb,
# third-party subjects, clause marks, other senses -- each with legitimate
# sentences of the same SHAPE, so a rule that only memorised the shape fails.
#
# Same categories as `language_corpus.yaml`:
#   T translation -> MATCH        X fixed expression -> MATCH
#   F inflection/order -> MATCH   S related concept -> never MATCH
#   P other sense -> not MATCH    N unrelated -> never MATCH
#   C About us / Benefits -> never MATCH
#
# The rules may be tuned against THIS file. `adversarial_holdout.yaml` was
# written at the same time and is read once, at the end of the round.
version: 1
